id: 05-content-addressable-storage
title: Bộ nhớ định danh theo nội dung (Content-Addressable Storage)
duration: 30
xp: 95
keywords:
  - content addressable
  - cryptographic hashing
  - sha-256
  - sha-1 compatibility
  - deduplication
  - immutability
prerequisites:
  - 04-object-database
objectives:
  - Hiểu sâu nguyên lý của Bộ nhớ định danh theo nội dung (Content-Addressable
    Storage - CAS).
  - Hiểu Git có thể tái sử dụng cùng object khi byte dữ liệu đã lưu giống nhau.
  - "Làm chủ công thức tiêu đề chuẩn mực của một đối tượng Git: <type>
    <size>\\0<content>."
commands:
  - echo -e "test content\n" | git hash-object --stdin
  - sha1sum
