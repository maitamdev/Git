id: quiz-08-git-internals-05-content-addressable-storage
title: "Trắc nghiệm: Bộ nhớ định danh theo nội dung (Content-Addressable Storage)"
questions:
  - id: q1
    question: Công thức chuỗi dữ liệu đầu vào mà Git sử dụng để tính toán mã băm
      SHA-1 cho một đối tượng là gì?
    type: single
    options:
      - text: <type> <size>\0<content>
        correct: true
      - text: <filename> <content>
        correct: false
      - text: <timestamp> <author> <content>
        correct: false
      - text: Chỉ riêng phần <content> thuần túy
        correct: false
    explanation: Git luôn gắn phần tiêu đề gồm loại đối tượng, dấu cách, kích thước
      byte, ký tự null byte (\0) rồi mới đến nội dung.
  - id: q2
    question: Nếu bạn có 5 tệp tin ở 5 thư mục khác nhau nhưng có nội dung hoàn toàn
      giống nhau từng ký tự, Git sẽ lưu bao nhiêu Blob trong .git/objects/?
    type: single
    options:
      - text: Đúng 1 đối tượng Blob duy nhất (cơ chế khử trùng lặp)
        correct: true
      - text: 5 đối tượng Blob riêng biệt
        correct: false
      - text: Không lưu đối tượng nào cả
        correct: false
      - text: 10 đối tượng
        correct: false
    explanation: Vì nội dung giống nhau nên mã băm giống nhau, Git tái sử dụng ngay
      đối tượng đã có mà không ghi đè thêm bản sao.
  - id: q3
    question: Đặc tính "Bất biến" (Immutability) trong hệ thống Content-Addressable
      Storage nghĩa là gì?
    type: single
    options:
      - text: Nội dung của một đối tượng đã tạo ra không bao giờ có thể bị sửa đổi, sửa
          nội dung sẽ sinh ra đối tượng mới với mã băm mới
        correct: true
      - text: Không ai có quyền xóa kho lưu trữ Git
        correct: false
      - text: Tệp tin bị khóa quyền chỉ đọc trên hệ điều hành
        correct: false
      - text: Chỉ có tác giả mới có quyền commit
        correct: false
    explanation: Mỗi đối tượng gắn liền vĩnh viễn với mã băm của nó. Thay đổi dù 1
      bit cũng biến nó thành một đối tượng hoàn toàn khác.
  - id: q4
    question: Lệnh nào cho phép bạn tính toán mã băm của một chuỗi dữ liệu mà không
      cần phải ghi đối tượng vào thư mục .git/objects/?
    type: single
    options:
      - text: git hash-object (không kèm cờ -w)
        correct: true
      - text: git hash-object -w
        correct: false
      - text: git write-tree
        correct: false
      - text: git cat-file -p
        correct: false
    explanation: Cờ `-w` viết tắt của write (ghi xuống đĩa). Nếu không có cờ `-w`,
      lệnh chỉ tính và in ra mã băm mà không ghi đối tượng.
