id: 16-object-graph-traversal
title: Duyệt đồ thị đối tượng có hướng (Directed Acyclic Graph)
duration: 35
xp: 100
keywords:
  - dag
  - graph traversal
  - reachability
  - dangling objects
  - git rev-list
prerequisites:
  - 15-revision-syntax
objectives:
  - Nắm vững bản chất toán học của Git như một Đồ thị có hướng không chu trình
    (Directed Acyclic Graph - DAG).
  - "Hiểu reachability từ refs, index và reflog; phân biệt dangling với
    unreachable object."
  - Sử dụng lệnh plumbing git rev-list và git fsck để duyệt toàn bộ đồ thị và
    phát hiện đối tượng mất kết nối.
commands:
  - git rev-list --all --count
  - git fsck --no-reflogs --unreachable
  - git log --graph --oneline --all
