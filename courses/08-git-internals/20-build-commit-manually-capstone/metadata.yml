id: 20-build-commit-manually-capstone
title: "Capstone: Tự tay tạo Commit hoàn chỉnh chỉ bằng Plumbing Commands"
duration: 50
xp: 250
keywords:
  - git internals capstone
  - build commit manually
  - plumbing only
  - mastery challenge
  - no porcelain
prerequisites:
  - 19-reflog-internals
objectives:
  - "Chinh phục thử thách tối thượng của Level 8: Tự tay tạo ra một Commit hợp
    lệ mà TUYỆT ĐỐI KHÔNG dùng git add hay git commit."
  - "Thực hiện quy trình 5 bước phẫu thuật: Băm Blob -> Cập nhật Index nhị phân
    -> Đóng gói Tree -> Tạo Commit object -> Cập nhật con trỏ nhánh."
  - Quan sát Git Graph và git log hiển thị commit do chính bạn lắp ráp thủ công
    từ các linh kiện cơ bản.
commands:
  - git hash-object -w <file>
  - git update-index --add --cacheinfo 100644 <hash> <path>
  - git write-tree
  - git commit-tree <tree-hash> -m "Manual commit"
  - git update-ref refs/heads/main <commit-hash>
