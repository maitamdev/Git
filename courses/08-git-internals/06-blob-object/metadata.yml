id: 06-blob-object
title: "Đối tượng Blob: Lưu trữ nội dung nhị phân và tệp tin"
duration: 30
xp: 90
keywords:
  - blob
  - binary large object
  - file content
  - git objects
  - metadata exclusion
prerequisites:
  - 05-content-addressable-storage
objectives:
  - Hiểu rõ bản chất của đối tượng Blob (Binary Large Object) trong Git.
  - Nắm quy tắc Blob lưu nội dung; tên và mode nằm trong tree, metadata lịch sử
    nằm trong commit.
  - Sử dụng các lệnh plumbing để băm, ghi và giải mã một đối tượng Blob.
commands:
  - git hash-object -w file.txt
  - git cat-file -t <hash>
  - git cat-file -p <hash>
