id: 03-dot-git-directory
title: Khám phá cấu trúc bên trong thư mục .git
duration: 30
xp: 90
keywords:
  - dot git directory
  - HEAD
  - config
  - index
  - objects
  - refs
  - hooks
prerequisites:
  - 02-porcelain-vs-plumbing
objectives:
  - Nhận biết Git directory và cách Git tìm đường dẫn metadata thực tế.
  - "Hiểu rõ chức năng của từng thành phần: HEAD, config, description, index,
    objects/, refs/, hooks/, info/."
  - Biết dùng lệnh Git để xem HEAD, remote và index mà không phụ thuộc vào vị trí
    file .git.
commands:
  - git rev-parse --git-dir
  - git rev-parse --git-path HEAD
  - git ls-files --stage
