id: 12-references-and-heads
title: "Cơ chế References (Refs): heads, tags và remotes"
duration: 30
xp: 90
keywords:
  - references
  - refs
  - heads
  - branches
  - tags
  - remotes
  - pointers
prerequisites:
  - 11-git-cat-file
objectives:
  - Hiểu nhánh local là ref trong namespace refs/heads/ trỏ tới commit; cách lưu
    vật lý và độ dài object ID phụ thuộc repository.
  - Phân biệt các namespace refs/heads/, refs/tags/ và refs/remotes/.
  - Sử dụng lệnh plumbing git update-ref để tạo và điều khiển con trỏ nhánh trực
    tiếp.
commands:
  - git show-ref --verify refs/heads/main
  - git show-ref
  - git update-ref refs/heads/test HEAD
