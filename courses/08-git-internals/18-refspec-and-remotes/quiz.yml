id: quiz-08-git-internals-18-refspec-and-remotes
title: "Trắc nghiệm: Cấu trúc Refspec và đồng bộ Remote References"
questions:
  - id: q1
    question: "Dấu cộng `+` ở đầu chuỗi Refspec (ví dụ:
      `+refs/heads/*:refs/remotes/origin/*`) có ý nghĩa gì?"
    type: single
    options:
      - text: Cho phép cập nhật tham chiếu đích kể cả khi thao tác không phải là
          fast-forward (force update)
        correct: true
      - text: Chỉ định kho lưu trữ có tính phí
        correct: false
      - text: Yêu cầu mã hóa tệp tin bằng mật khẩu
        correct: false
      - text: Cộng thêm 1 commit vào lịch sử
        correct: false
    explanation: Dấu `+` cho phép ref đích cập nhật non-fast-forward; với push, máy
      chủ vẫn có thể từ chối theo chính sách của họ.
  - id: q2
    question: Cú pháp lệnh `git push origin :old-branch` (để trống phần nguồn trước
      dấu hai chấm) có tác dụng gì?
    type: single
    options:
      - text: Yêu cầu xóa ref `old-branch` trên remote
        correct: true
      - text: Đổi tên nhánh thành rỗng
        correct: false
      - text: Tạo một nhánh mới không có commit
        correct: false
      - text: Báo lỗi cú pháp
        correct: false
    explanation: Refspec push có source rỗng yêu cầu remote xóa ref đích; hãy xác nhận
      remote và tên ref trước khi chạy vì thao tác này có thể làm mất nhánh chia sẻ.
  - id: q3
    question: Refspec fetch thường gặp trong một bản clone thông thường là gì?
    type: single
    options:
      - text: +refs/heads/*:refs/remotes/origin/*
        correct: true
      - text: refs/all:refs/all
        correct: false
      - text: master:main
        correct: false
      - text: remote:local
        correct: false
    explanation: Cấu hình thường ánh xạ các nhánh `refs/heads/*` của remote sang
      `refs/remotes/origin/*` ở local; clone một nhánh hoặc cấu hình riêng có thể khác.
  - id: q4
    question: Tại sao các nhánh từ xa (như `origin/main`) lại được đặt trong không
      gian tên `refs/remotes/` thay vì `refs/heads/`?
    type: single
    options:
      - text: Để tách ref theo dõi vị trí remote khỏi nhánh local mà bạn trực tiếp làm việc
        correct: true
      - text: Do hạn chế về dung lượng ổ đĩa
        correct: false
      - text: Để người khác không xem được mã nguồn của bạn
        correct: false
      - text: Để máy tính tự động dịch sang tiếng Anh
        correct: false
    explanation: Namespace riêng giúp phân biệt nhánh local `refs/heads/main` với
      ref theo dõi `refs/remotes/origin/main`; fetch cập nhật ref theo dõi.
  - id: q5
    question: Trong lệnh `git push origin main`, source ref và destination ref thường tương ứng với cặp nào?
    type: single
    options:
      - text: refs/heads/main:refs/heads/main
        correct: true
      - text: refs/heads/main:refs/remotes/origin/main
        correct: false
      - text: HEAD:refs/tags/main
        correct: false
      - text: +refs/remotes/*:refs/heads/*
        correct: false
    explanation: Với lệnh explicit `main`, Git gửi nhánh local `refs/heads/main` tới
      ref cùng tên trên remote, trừ khi cấu hình hoặc refspec khác thay đổi đích.
  - id: q6
    question: Làm thế nào để chỉ fetch duy nhất một nhánh `feature-login` mà không
      muốn kéo về tất cả các nhánh khác từ origin?
    type: single
    options:
      - text: git fetch origin +refs/heads/feature-login:refs/remotes/origin/feature-login
        correct: true
      - text: git fetch origin --all --single
        correct: false
      - text: git clone origin/feature-login
        correct: false
      - text: git pull --only-one
        correct: false
    explanation: Refspec nêu rõ source ref từ remote và đích local; dấu `+` cho phép
      đích cập nhật non-fast-forward nếu nhánh remote đã bị viết lại.
