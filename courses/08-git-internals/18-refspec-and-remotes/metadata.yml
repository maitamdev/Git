id: 18-refspec-and-remotes
title: Cấu trúc Refspec và đồng bộ Remote References
duration: 30
xp: 90
keywords:
  - refspec
  - remote references
  - fetch refspec
  - push refspec
  - git config
prerequisites:
  - 17-packfiles-and-deltas
objectives:
  - Đọc refspec dạng `[+]<source>:<destination>` và giải thích chiều fetch/push.
  - Hiểu rõ cơ chế ánh xạ không gian tên (Namespace Mapping) giữa nhánh máy chủ
    và nhánh theo dõi cục bộ.
  - Thực hành fetch, push và xóa ref bằng một remote sandbox local.
commands:
  - git config --get remote.origin.fetch
  - git fetch origin
  - git fetch origin +refs/heads/main:refs/remotes/origin/main
