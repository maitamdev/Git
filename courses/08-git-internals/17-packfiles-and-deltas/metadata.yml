id: 17-packfiles-and-deltas
title: Đóng gói Packfiles và nén sai biệt Delta Compression
duration: 35
xp: 95
keywords:
  - packfiles
  - delta compression
  - loose objects
  - git pack
  - storage optimization
prerequisites:
  - 16-object-graph-traversal
objectives:
  - Hiểu rõ sự khác biệt giữa Loose Objects (đối tượng rời rạc) và Packed
    Objects (đối tượng đóng gói trong Packfile).
  - Hiểu object trong pack có thể được lưu đầy đủ hoặc dưới dạng delta dựa trên
    một object khác; lựa chọn base không cố định theo tuổi phiên bản.
  - Sử dụng git verify-pack và git count-objects để kiểm tra pack và thống kê object.
commands:
  - git verify-pack -v <path-to-pack.idx>
  - git count-objects -v
