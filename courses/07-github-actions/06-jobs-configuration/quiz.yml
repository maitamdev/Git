id: quiz-07-github-actions-06-jobs-configuration
title: "Trắc nghiệm: Cấu hình Jobs: runs-on, phân tách độc lập và môi trường"
questions:
  - id: q1
    question: Thuộc tính nào là bắt buộc phải có trong mỗi định nghĩa Job của GitHub
      Actions?
    type: single
    options:
      - text: runs-on
        correct: true
      - text: timeout
        correct: false
      - text: machine-type
        correct: false
      - text: os-system
        correct: false
    explanation: GitHub Actions bắt buộc phải biết máy ảo loại nào được dùng để thực
      thi Job thông qua từ khóa `runs-on`.
  - id: q2
    question: Giá trị nào sau đây thường được sử dụng phổ biến và tiết kiệm nhất cho
      thuộc tính runs-on?
    type: single
    options:
      - text: ubuntu-latest
        correct: true
      - text: macos-latest
        correct: false
      - text: windows-latest
        correct: false
      - text: solaris-latest
        correct: false
    explanation: "`ubuntu-latest` là môi trường Linux phổ biến nhất, tốc độ khởi
      động cực nhanh và có chi phí tài nguyên thấp nhất."
  - id: q3
    question: Điều gì xảy ra với hệ thống tệp tin sau khi một Job kết thúc phiên
      chạy của mình?
    type: single
    options:
      - text: Máy ảo Runner bị hủy hoàn toàn cùng toàn bộ dữ liệu tạm thời trên ổ đĩa
        correct: true
      - text: Hệ thống tự động lưu toàn bộ ổ cứng vào tài khoản Google Drive của bạn
        correct: false
      - text: Tệp tin được giữ nguyên vĩnh viễn cho lần chạy tiếp theo
        correct: false
      - text: Dữ liệu tự động chuyển sang máy tính cá nhân của lập trình viên
        correct: false
    explanation: Các Runner do GitHub lưu trữ (GitHub-hosted) hoạt động theo mô hình
      phi trạng thái (ephemeral), máy ảo bị xóa sạch ngay sau khi Job kết thúc.
  - id: q4
    question: Mục đích của việc đặt trường `name:` bên trong cấu hình Job là gì?
    type: single
    options:
      - text: Hiển thị tên mô tả thân thiện, dễ đọc trên giao diện web của GitHub
          Actions
        correct: true
      - text: Đặt tên tài khoản đăng nhập vào máy ảo
        correct: false
      - text: Đặt mật khẩu mã hóa cho tệp cấu hình
        correct: false
      - text: Quy định tên của thư mục chứa mã nguồn
        correct: false
    explanation: Trường `name:` giúp người quản trị dễ dàng nhận diện tác vụ trên
      giao diện trực quan thay vì chỉ nhìn thấy mã định danh `job_id`.
