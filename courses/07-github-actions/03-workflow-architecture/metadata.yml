id: 03-workflow-architecture
title: "Kiến trúc Workflow: Events, Jobs, Steps và Runners"
duration: 30
xp: 90
keywords:
  - workflow architecture
  - event
  - job
  - step
  - runner
  - dag
prerequisites:
  - 02-github-actions-intro
objectives:
  - Hiểu Event có thể kích hoạt Workflow; Workflow chứa Jobs, mỗi Job chạy trên
    Runner và có các Steps.
  - Phân biệt Step gọi Action bằng uses với Step chạy lệnh shell bằng run.
  - Hiểu các Job không phụ thuộc có thể chạy song song, còn các Step trong một
    Job chạy theo thứ tự.
commands:
  - cat .github/workflows/ci.yml
  - tree .github
