id: 15-artifacts-sharing
title: Lưu trữ và chia sẻ sản phẩm build với Artifacts
duration: 30
xp: 95
keywords:
  - artifacts
  - upload artifact
  - download artifact
  - build output
  - data sharing
prerequisites:
  - 14-matrix-strategy
objectives:
  - Hiểu rõ khái niệm Artifact như cầu nối lưu trữ và truyền tải dữ liệu giữa
    các Job độc lập.
  - Sử dụng thành thạo action actions/upload-artifact@v7 để lưu trữ gói tệp tin
    sau khi build.
  - Sử dụng thành thạo action actions/download-artifact@v8 để kéo sản phẩm về
    máy ảo của Job triển khai.
commands:
  - ls -la dist/
  - tar -czf app.tar.gz dist/
