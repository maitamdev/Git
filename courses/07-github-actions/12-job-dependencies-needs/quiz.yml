id: quiz-07-github-actions-12-job-dependencies-needs
title: "Trắc nghiệm: Quan hệ phụ thuộc giữa các Job với thuộc tính needs"
questions:
  - id: q1
    question: Thuộc tính nào được sử dụng để bắt buộc một Job phải chờ một Job khác
      hoàn thành trước?
    type: single
    options:
      - text: needs
        correct: true
      - text: depends_on
        correct: false
      - text: after
        correct: false
      - text: wait_for
        correct: false
    explanation: Trong GitHub Actions, từ khóa `needs:` là thuộc tính tiêu chuẩn để
      khai báo mối quan hệ phụ thuộc giữa các Job.
  - id: q2
    question: "Điều gì xảy ra nếu Job A bị thất bại (failed) và Job B có khai báo
      `needs: A`?"
    type: single
    options:
      - text: Job B sẽ tự động bị bỏ qua (skipped) và không được thực thi
        correct: true
      - text: Job B vẫn chạy bình thường
        correct: false
      - text: Hệ thống tự động chạy lại Job A lần thứ hai
        correct: false
      - text: Toàn bộ workflow bị xóa khỏi kho lưu trữ
        correct: false
    explanation: Mặc định, nếu bất kỳ Job tiên quyết nào trong danh sách `needs` bị
      thất bại, các Job phụ thuộc phía sau sẽ bị hủy bỏ.
  - id: q3
    question: Hiện tượng Circular Dependency (Vòng lặp phụ thuộc) ví dụ A cần B và B
      cần A sẽ dẫn đến kết quả gì?
    type: single
    options:
      - text: Workflow bị lỗi xác thực cú pháp và hoàn toàn không thể khởi chạy
        correct: true
      - text: Cả hai Job cùng chạy vĩnh viễn không bao giờ dừng
        correct: false
      - text: GitHub Actions tự động xóa Job B để giải quyết
        correct: false
      - text: Không có vấn đề gì, hệ thống tự động xử lý được
        correct: false
    explanation: GitHub Actions yêu cầu đồ thị DAG không được có chu trình
      (Acyclic). Nếu phát hiện vòng lặp, workflow sẽ bị từ chối ngay lập tức.
  - id: q4
    question: Để kiểm tra kết quả thực thi của Job tiên quyết có tên là `build`, ta
      dùng cú pháp ngữ cảnh nào?
    type: single
    options:
      - text: needs.build.result
        correct: true
      - text: jobs.build.status
        correct: false
      - text: steps.build.outcome
        correct: false
      - text: env.BUILD_RESULT
        correct: false
    explanation: "Ngữ cảnh `needs.<job_id>.result` trả về trạng thái hoàn thành của
      Job đó (ví dụ: `success`, `failure`, `cancelled`, hoặc `skipped`)."
