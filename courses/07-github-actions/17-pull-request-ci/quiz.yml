id: quiz-07-github-actions-17-pull-request-ci
title: "Trắc nghiệm: Thiết lập CI Pipeline tự động kiểm thử trên Pull Request"
questions:
  - id: q1
    question: Sự kiện nào trong GitHub Actions được kích hoạt khi một nhà phát triển
      tạo hoặc đẩy thêm mã vào một Pull Request?
    type: single
    options:
      - text: pull_request
        correct: true
      - text: merge_request
        correct: false
      - text: code_review
        correct: false
      - text: pr_create
        correct: false
    explanation: Sự kiện `pull_request` lắng nghe mọi biến động liên quan đến vòng
      đời của Pull Request trong kho lưu trữ.
  - id: q2
    question: Khi tính năng "Require status checks to pass before merging" được bật,
      điều gì sẽ xảy ra nếu bài test CI bị thất bại?
    type: single
    options:
      - text: Nút Merge bị khóa chặt và không ai có thể hợp nhất mã nguồn bị lỗi vào
          nhánh chính
        correct: true
      - text: Nhánh chính tự động bị xóa
        correct: false
      - text: Mã nguồn tự động được hợp nhất nhưng có cảnh báo màu vàng
        correct: false
      - text: Lập trình viên bị trừ tiền lương tự động
        correct: false
    explanation: Quy tắc bảo vệ nhánh sẽ cưỡng chế việc chặn nút Merge cho đến khi
      tất cả các bài kiểm thử bắt buộc đều đạt kết quả xanh.
  - id: q3
    question: "Tại sao không nên cấu hình workflow chạy đồng thời trên `on: [push,
      pull_request]` cho cùng một nhánh nội bộ?"
    type: single
    options:
      - text: Vì khi lập trình viên đẩy commit lên nhánh của PR, workflow sẽ bị kích
          hoạt trùng lặp 2 lần cùng lúc
        correct: true
      - text: Vì làm máy chủ của GitHub bị nổ tung
        correct: false
      - text: Vì GitHub cấm khai báo nhiều sự kiện
        correct: false
      - text: Vì kết quả của hai lần chạy sẽ triệt tiêu lẫn nhau
        correct: false
    explanation: Việc kích hoạt cả hai sự kiện trên cùng một nhánh khiến GitHub
      Actions chạy hai phiên làm việc giống hệt nhau, làm tăng gấp đôi chi phí
      thời gian.
  - id: q4
    question: Lệnh GitHub CLI nào cho phép lập trình viên theo dõi tiến độ các bài
      kiểm tra Status Checks của PR hiện tại?
    type: single
    options:
      - text: gh pr checks
        correct: true
      - text: gh test status
        correct: false
      - text: gh ci view
        correct: false
      - text: gh run inspect
        correct: false
    explanation: "`gh pr checks` liệt kê chi tiết từng bài kiểm tra trạng thái đang
      chờ, thành công hoặc thất bại gắn liền với PR hiện tại."
  - id: q5
    question: Tham chiếu Git nào được GitHub Actions tự động kiểm thử khi sự kiện
      pull_request được kích hoạt?
    type: single
    options:
      - text: refs/pull/:number/merge
        correct: true
      - text: refs/heads/:feature_branch
        correct: false
      - text: refs/tags/:release_tag
        correct: false
      - text: refs/remotes/upstream/head
        correct: false
    explanation: GitHub Actions tự động tạo một merge commit thử nghiệm tại
      `refs/pull/:number/merge` để kiểm tra xung đột và tính toàn vẹn của mã sau
      khi hợp nhất.
  - id: q6
    question: Trong quy trình CI Pull Request, trạng thái nào sau đây của Status
      Check biểu thị rằng bài kiểm tra đang được chạy?
    type: single
    options:
      - text: pending
        correct: true
      - text: success
        correct: false
      - text: failure
        correct: false
      - text: cancelled
        correct: false
    explanation: Trạng thái `pending` cho biết workflow hoặc job kiểm thử đang trong
      quá trình thực thi trên runner và chưa có kết luận cuối cùng.
