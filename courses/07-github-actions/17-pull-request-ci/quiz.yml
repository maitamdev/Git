id: quiz-07-github-actions-17-pull-request-ci
title: "Trắc nghiệm: Thiết lập CI Pipeline tự động kiểm thử trên Pull Request"
questions:
  - id: q1
    question: Sự kiện nào trong GitHub Actions được kích hoạt khi một nhà phát triển
      tạo hoặc đẩy thêm mã vào một Pull Request?
    type: single
    options:
      - text: pull_request
        correct: true
      - text: merge_request
        correct: false
      - text: code_review
        correct: false
      - text: pr_create
        correct: false
    explanation: Sự kiện `pull_request` lắng nghe mọi biến động liên quan đến vòng
      đời của Pull Request trong kho lưu trữ.
  - id: q2
    question: Khi tính năng "Require status checks to pass before merging" được bật,
      điều gì sẽ xảy ra nếu bài test CI bị thất bại?
    type: single
    options:
      - text: Merge bị chặn nếu check được cấu hình required và không có quyền bypass phù hợp
        correct: true
      - text: Nhánh chính tự động bị xóa
        correct: false
      - text: Mã nguồn tự động được hợp nhất nhưng có cảnh báo màu vàng
        correct: false
      - text: Lập trình viên bị trừ tiền lương tự động
        correct: false
    explanation: Required status checks chặn merge khi chưa đạt; quyền bypass vẫn phụ thuộc cấu hình branch protection hoặc ruleset.
  - id: q3
    question: "Tại sao không nên cấu hình workflow chạy đồng thời trên `on: [push,
      pull_request]` cho cùng một nhánh nội bộ?"
    type: single
    options:
      - text: Một lần push có thể khớp cả hai trigger và tạo hai workflow run, tùy bộ lọc nhánh/sự kiện
        correct: true
      - text: Vì làm máy chủ của GitHub bị nổ tung
        correct: false
      - text: Vì GitHub cấm khai báo nhiều sự kiện
        correct: false
      - text: Vì kết quả của hai lần chạy sẽ triệt tiêu lẫn nhau
        correct: false
    explanation: Push lên nhánh đang có PR có thể khớp cả `push` lẫn `pull_request`; hãy kiểm tra bộ lọc trước khi bỏ một trigger.
  - id: q4
    question: Lệnh GitHub CLI nào cho phép lập trình viên theo dõi tiến độ các bài
      kiểm tra Status Checks của PR hiện tại?
    type: single
    options:
      - text: gh pr checks
        correct: true
      - text: gh test status
        correct: false
      - text: gh ci view
        correct: false
      - text: gh run inspect
        correct: false
    explanation: "`gh pr checks` liệt kê chi tiết từng bài kiểm tra trạng thái đang
      chờ, thành công hoặc thất bại gắn liền với PR hiện tại."
  - id: q5
    question: Với PR có thể merge, tham chiếu nào thường được checkout mặc định cho sự kiện pull_request?
    type: single
    options:
      - text: refs/pull/:number/merge
        correct: true
      - text: refs/heads/:feature_branch
        correct: false
      - text: refs/tags/:release_tag
        correct: false
      - text: refs/remotes/upstream/head
        correct: false
    explanation: Merge ref biểu diễn kết quả thử merge để kiểm tra; nó không phải commit đã được đưa vào nhánh đích.
  - id: q6
    question: Trong quy trình CI Pull Request, trạng thái nào sau đây của Status
      Check biểu thị rằng bài kiểm tra đang được chạy?
    type: single
    options:
      - text: pending
        correct: true
      - text: success
        correct: false
      - text: failure
        correct: false
      - text: cancelled
        correct: false
    explanation: "`pending` nghĩa là check chưa có kết quả cuối cùng; workflow có thể đang chạy hoặc bị bỏ qua do filter."
