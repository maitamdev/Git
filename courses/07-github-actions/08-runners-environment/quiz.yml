id: quiz-07-github-actions-08-runners-environment
title: "Trắc nghiệm: Môi trường thực thi Runners: GitHub-hosted vs Self-hosted"
questions:
  - id: q1
    question: Đặc điểm nào sau đây là của GitHub-hosted Runner?
    type: single
    options:
      - text: Mỗi Job được chạy trên một máy ảo sạch và máy ảo bị hủy ngay sau khi Job
          kết thúc
        correct: true
      - text: Bạn phải tự mua phần cứng máy chủ và cắm dây mạng
        correct: false
      - text: Toàn bộ dữ liệu của lần chạy trước được giữ nguyên trên ổ đĩa
        correct: false
      - text: Không hỗ trợ hệ điều hành Linux
        correct: false
    explanation: GitHub-hosted Runners được sinh ra tức thời theo yêu cầu và bị hủy
      ngay lập tức để đảm bảo tính an toàn và sạch sẽ.
  - id: q2
    question: Trường hợp nào sau đây là lý do chính đáng nhất để đầu tư Self-hosted
      Runner?
    type: single
    options:
      - text: Cần phần cứng đặc biệt như card đồ họa GPU hoặc cần truy cập trực tiếp
          mạng nội bộ công ty
        correct: true
      - text: Chỉ để in ra dòng chữ "Hello World"
        correct: false
      - text: Để không bao giờ phải viết tệp YAML nữa
        correct: false
      - text: Để tránh việc phải kết nối Internet
        correct: false
    explanation: Self-hosted Runners phù hợp khi cần tài nguyên phần cứng lớn, thời
      lượng chạy dài hoặc cần kết nối cơ sở dữ liệu nội bộ.
  - id: q3
    question: Tại sao việc dùng Self-hosted Runner cho kho lưu trữ Public lại cực kỳ
      nguy hiểm?
    type: single
    options:
      - text: Bất kỳ ai trên Internet mở PR cũng có thể chạy lệnh tùy ý trên máy chủ của
          bạn để đánh cắp dữ liệu hoặc đào tiền ảo
        correct: true
      - text: Làm máy chủ bị tiêu tốn quá nhiều giấy in
        correct: false
      - text: Khiến màn hình máy chủ bị đổi màu nền
        correct: false
      - text: GitHub sẽ tự động xóa tài khoản cá nhân của bạn ngay lập tức
        correct: false
    explanation: Mọi mã nguồn trong PR từ cộng đồng đều có thể thực thi với quyền
      hạn của máy chủ nội bộ, tiềm ẩn nguy cơ bảo mật nghiêm trọng.
  - id: q4
    question: Để chỉ định Job chạy trên một Self-hosted Runner do bạn tự cấu hình,
      cú pháp runs-on sẽ là gì?
    type: single
    options:
      - text: "runs-on: self-hosted"
        correct: true
      - text: "runs-on: my-home-pc"
        correct: false
      - text: "runs-on: private-server"
        correct: false
      - text: "runs-on: local-machine"
        correct: false
    explanation: Nhãn `self-hosted` là nhãn mặc định bắt buộc được gán cho mọi
      Runner tự quản lý.
