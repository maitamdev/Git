id: 03-head-snapshot
title: Repository & HEAD Snapshot
duration: 25
xp: 70
keywords:
  - repository
  - head
  - snapshot
  - commit graph
  - kho luu tru
prerequisites:
  - 02-staging-area
objectives:
  - Nhận biết `HEAD` là vị trí hiện tại trong lịch sử Git.
  - Phân biệt tệp đang sửa với trạng thái đã lưu trong commit.
  - Dùng `git show HEAD` để xem commit hiện tại.
commands:
  - git log --oneline
  - git show HEAD
