id: 04-git-status
title: Kiểm tra trạng thái với git status
duration: 25
xp: 80
keywords:
  - git status
  - trang thai
  - kiem tra
  - short format
prerequisites:
  - 03-head-snapshot
objectives:
  - Chạy git status để biết tệp mới, đã sửa hoặc đã staged.
  - Phân biệt nhóm staged, chưa staged và untracked.
  - Đọc hai cột trạng thái cơ bản trong git status -s.
commands:
  - git status
  - git status -s
