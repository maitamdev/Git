id: 08-git-log
title: Tra cứu lịch sử với git log
duration: 25
xp: 80
keywords:
  - git log
  - lich su
  - oneline
  - graph
  - tra cuu commit
prerequisites:
  - 06-git-commit
objectives:
  - Dùng `git log` để xem các commit trong lịch sử nhánh hiện tại.
  - Dùng `--oneline` và `--graph` để thay đổi cách hiển thị.
  - Giới hạn số kết quả bằng `-n`.
commands:
  - git log
  - git log --oneline
  - git log --graph --oneline
  - git log -n 5
