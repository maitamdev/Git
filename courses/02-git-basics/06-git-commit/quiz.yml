id: quiz-02-06-git-commit
title: "Trắc nghiệm chuyên sâu: Bản chất lệnh git commit"
questions:
  - id: q1
    question: Bản chất kỹ thuật của một commit trong Git là gì?
    type: single
    options:
      - text: Một ảnh chụp toàn diện (Snapshot) của toàn bộ cây thư mục tại một thời
          điểm cụ thể
        correct: true
      - text: Một bản ghi chứa các dòng code bị xóa khỏi ổ cứng
        correct: false
      - text: Một lệnh gửi email tự động tới ban giám đốc công ty
        correct: false
      - text: Một tệp sao lưu nén định dạng zip đặt ngoài màn hình Desktop
        correct: false
    explanation: Git lưu trữ commit dưới dạng một snapshot toàn vẹn của cây thư mục,
      tái sử dụng các tệp không đổi qua con trỏ.
  - id: q2
    question: Lệnh nào dưới đây tạo commit mới với thông điệp ngắn gọn mà không cần
      mở trình soạn thảo văn bản?
    type: single
    options:
      - text: git commit -m "thông điệp"
        correct: true
      - text: git commit --text "thông điệp"
        correct: false
      - text: git commit -s "thông điệp"
        correct: false
      - text: git save "thông điệp"
        correct: false
    explanation: Cờ `-m` viết tắt của `--message` cho phép truyền thông điệp commit
      trực tiếp trên dòng lệnh.
  - id: q3
    question: Lệnh `git commit -am "fix bug"` có hạn chế quan trọng nào mà lập trình
      viên cần lưu ý?
    type: single
    options:
      - text: Không tự động stage được các tệp tin mới tạo ở trạng thái Untracked
        correct: true
      - text: Lệnh này chỉ chạy được trên hệ điều hành macOS
        correct: false
      - text: Lệnh này xóa sạch toàn bộ lịch sử commit trước đó
        correct: false
      - text: Lệnh này bắt buộc phải có kết nối Internet mới chạy được
        correct: false
    explanation: Cờ `-a` chỉ tự động stage các tệp Modified đã được theo dõi, hoàn
      toàn bỏ qua các tệp Untracked.
  - id: q4
    question: Sau khi chạy lệnh git commit trên máy cá nhân, mã nguồn của bạn đã nằm
      ở đâu?
    type: single
    options:
      - text: Nằm an toàn trong kho lưu trữ Git cục bộ trên ổ cứng máy bạn
        correct: true
      - text: Đã tự động xuất hiện trên trang web GitHub của cả nhóm
        correct: false
      - text: Đã được gửi tới kho lưu trữ trung tâm của Google
        correct: false
      - text: Đã bị mã hóa và gửi vào hòm thư điện tử
        correct: false
    explanation: Git commit chỉ ghi nhận dữ liệu vào cơ sở dữ liệu cục bộ; cần dùng
      lệnh `git push` để đẩy lên máy chủ GitHub.
  - id: q5
    question: Mỗi đối tượng commit trong Git bắt buộc phải chứa thông tin nào sau đây?
    type: single
    options:
      - text: Con trỏ tới cây thư mục (Tree), thông tin tác giả, mốc thời gian và thông
          điệp commit
        correct: true
      - text: Số chứng minh nhân dân hoặc căn cước của lập trình viên
        correct: false
      - text: Mật khẩu thẻ tín dụng dùng để thanh toán phí bản quyền
        correct: false
      - text: Địa chỉ nhà riêng và số điện thoại của tác giả
        correct: false
    explanation: Một commit object chuẩn của Git gồm mã hash cây thư mục, commit
      cha, tác giả (author/committer), timestamp và message.
  - id: q6
    question: Lệnh `git commit --amend` thường được sử dụng trong trường hợp nào?
    type: single
    options:
      - text: Bổ sung tệp tin bị bỏ sót hoặc sửa lại thông điệp của commit gần nhất
        correct: true
      - text: Xóa toàn bộ kho lưu trữ Git để làm lại từ đầu
        correct: false
      - text: Tạo một nhánh mới có tên là amend
        correct: false
      - text: Khóa kho chứa để không ai được phép commit nữa
        correct: false
    explanation: "`--amend` cho phép sửa đổi snapshot hoặc message của commit ngay
      trên đỉnh HEAD mà không tạo thêm commit rác."
