id: 06-git-commit
title: Lưu snapshot với git commit
duration: 30
xp: 100
keywords:
  - git commit
  - snapshot
  - commit message
prerequisites:
  - 05-git-add
objectives:
  - Tạo commit từ thay đổi đã staged.
  - Viết lời nhắn ngắn bằng `git commit -m`.
  - Phân biệt commit trên máy với push lên dịch vụ trực tuyến.
commands:
  - git status
  - git add <file>
  - 'git commit -m "feat: your commit message"'
  - git log --oneline
