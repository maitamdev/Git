id: 07-reflog-recovery
title: Khôi phục commit bị mất bằng reflog
duration: 35
xp: 110
keywords:
  - reflog recovery
  - khoi phuc commit
  - cuu commit mat
  - dangling commit
  - reviving branch
  - git rescue
prerequisites:
  - 06-git-reflog
objectives:
  - "Thành thạo quy trình 4 bước cứu hộ commit bị mất: Kiểm tra reflog -> Xác
    định tọa độ -> Tạo nhánh cứu hộ -> Hợp nhất."
  - Khôi phục thành công một commit vừa bị xóa do câu lệnh `git reset --hard`.
  - Hồi sinh nguyên vẹn một nhánh tính năng vừa bị lỡ tay xóa cưỡng chế bằng
    `git branch -D`.
  - Xây dựng tâm lý bình tĩnh, tự tin xử lý mọi sự cố mất mát mã nguồn trong dự
    án.
commands:
  - git reflog
  - git branch <tên-nhánh-cứu-hộ> <commit-hash>
  - git reset --hard HEAD@{n}
  - git checkout -b <nhánh-mới> HEAD@{n}
