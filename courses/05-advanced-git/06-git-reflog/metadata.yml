id: 06-git-reflog
title: git reflog
duration: 25
xp: 85
keywords:
  - git reflog
  - reference logs
  - nhat ky tham chieu
  - cuu ho git
  - head history
  - safety net
prerequisites:
  - 04-git-reset-hard
objectives:
  - Hiểu reflog ghi lại các lần cập nhật HEAD, nhánh và một số ref cục bộ khác.
  - Phân biệt sự khác nhau căn bản giữa nhật ký commit (`git log`) và nhật ký
    tham chiếu (`git reflog`).
  - "Đọc hiểu cú pháp định danh vị trí thời gian của reflog: `HEAD@{0}`,
    `HEAD@{1}`, `HEAD@{2 days ago}`."
  - Biết reflog không lưu file chưa commit và các entry có thể hết hạn theo cấu hình.
commands:
  - git reflog
  - git status
