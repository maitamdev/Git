id: 02-git-reset-soft
title: git reset --soft
duration: 25
xp: 80
keywords:
  - git reset --soft
  - reset soft
  - hoan tac commit giu staging
  - amend commit alternative
  - undo commit
prerequisites:
  - 01-undo-restore-reset-revert
objectives:
  - Hiểu rõ bản chất hoạt động của cờ `--soft` trong câu lệnh `git reset`.
  - Biết chính xác trạng thái của HEAD, Staging Area và Working Directory sau
    khi chạy `git reset --soft`.
  - Ứng dụng `git reset --soft` để gộp nhiều commit nhỏ hoặc viết lại commit
    message một cách linh hoạt.
  - Phân biệt sự khác nhau giữa reset soft và các chế độ mixed hay hard.
commands:
  - git reset --soft HEAD~1
  - git reset --soft <commit-hash>
  - git status
  - git commit -m "<thông-điệp-mới>"
