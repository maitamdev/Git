id: quiz-05-20-git-bisect
title: "Trắc nghiệm: git bisect"
questions:
  - id: q1
    question: Thuật toán tìm kiếm mà câu lệnh `git bisect` áp dụng để truy tìm
      commit gây lỗi là thuật toán nào?
    type: single
    options:
      - text: Tìm kiếm nhị phân (Binary Search) chia đôi phạm vi sau mỗi bước kiểm tra
        correct: true
      - text: Tìm kiếm tuyến tính tuần tự từ đầu đến cuối
        correct: false
      - text: Tìm kiếm ngẫu nhiên theo xác suất
        correct: false
      - text: Tìm kiếm theo độ dài của thông điệp commit
        correct: false
    explanation: "`git bisect` chia đôi lịch sử theo thuật toán Binary Search, mang
      lại hiệu quả cực cao với độ phức tạp O(log N)."
  - id: q2
    question: Giả sử khoảng cách giữa commit tốt (good) và commit lỗi (bad) là 1.000
      commit, bạn cần tối đa khoảng bao nhiêu lần kiểm tra để tìm ra thủ phạm?
    type: single
    options:
      - text: Khoảng 10 lần kiểm tra (vì 2^10 = 1024)
        correct: true
      - text: Khoảng 500 lần kiểm tra
        correct: false
      - text: Khoảng 1.000 lần kiểm tra
        correct: false
      - text: Chỉ cần đúng 1 lần duy nhất
        correct: false
    explanation: Nhờ tính chất lũy thừa cơ số 2 của thuật toán nhị phân, 1.000
      commit chỉ cần tối đa khoảng 10 bước kiểm thử.
  - id: q3
    question: Sau khi đã tìm ra chính xác commit gây lỗi bằng `git bisect`, câu lệnh
      BẮT BUỘC bạn phải chạy để quay về nhánh làm việc ban đầu là gì?
    type: single
    options:
      - text: git bisect reset
        correct: true
      - text: git bisect stop
        correct: false
      - text: git bisect finish
        correct: false
      - text: git checkout main --force
        correct: false
    explanation: "`git bisect reset` dọn dẹp các con trỏ bisect tạm thời và đưa HEAD
      quay trở về nhánh ban đầu của bạn."
  - id: q4
    question: Tính năng tự động hóa tối thượng `git bisect run <script>` xác định
      commit là Good hay Bad dựa trên tiêu chí nào của script?
    type: single
    options:
      - text: "Mã thoát (Exit code) của script: mã 0 là Good, mã khác 0 (từ 1 đến 127)
          là Bad"
        correct: true
      - text: Dung lượng của tệp script tính bằng kilobyte
        correct: false
      - text: Thời gian chạy script tính bằng mili-giây
        correct: false
      - text: Màu sắc hiển thị trên màn hình terminal
        correct: false
    explanation: Theo chuẩn POSIX, exit code 0 biểu thị thành công (Good), các mã
      lỗi khác 0 biểu thị thất bại (Bad).
