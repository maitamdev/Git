id: 20-git-bisect
title: git bisect
duration: 35
xp: 120
keywords:
  - git bisect
  - binary search git
  - tim loi nhi phan
  - debug commit
  - truy tim bug
  - bisect automation
prerequisites:
  - 18-git-tag
objectives:
  - Nắm vững nguyên lý tìm kiếm nhị phân (Binary Search) được áp dụng trong câu
    lệnh `git bisect`.
  - "Vận hành quy trình 4 bước truy tìm thủ phạm gây lỗi: `start` -> đánh dấu
    `bad`/`good` -> thử nghiệm -> `reset`."
  - "Hiểu rằng bisect cần khoảng 10 lần kiểm tra cho 1.000 commit khi có mốc tốt/xấu rõ ràng và lỗi chuyển một lần."
  - Biết dùng `git bisect run` trong Git thật với script kiểm thử tin cậy.
commands:
  - git bisect start
  - git bisect bad
  - git bisect good <commit-hoặc-tag>
  - git bisect reset
  - git bisect log
