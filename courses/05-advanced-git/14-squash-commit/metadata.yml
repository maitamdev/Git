id: 14-squash-commit
title: Squash Commit
duration: 30
xp: 95
keywords:
  - squash commit
  - git squash
  - gop commit
  - interactive rebase squash
  - ket hop commit
  - clean history
prerequisites:
  - 13-interactive-rebase
objectives:
  - Nắm vững khái niệm và kỹ thuật gộp commit (Squash Commit) trong Git.
  - Sử dụng chỉ thị `squash` (hoặc `s`) trong Interactive Rebase để gộp nhiều
    commit vụn vặt thành một khối.
  - Biên tập lại thông điệp commit kết hợp (Combined Commit Message) sao cho súc
    tích và mạch lạc.
  - Phân biệt sự khác biệt giữa chỉ thị `squash` (giữ lại message để chỉnh sửa)
    và `fixup` (bỏ qua message).
commands:
  - git rebase -i HEAD~<n>
  - s <commit-hash> <message>
  - squash <commit-hash> <message>
  - git log --oneline -n 5
