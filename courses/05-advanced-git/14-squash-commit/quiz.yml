id: quiz-05-14-squash-commit
title: "Trắc nghiệm: Kỹ thuật Squash Commit"
questions:
  - id: q1
    question: Điều gì sẽ xảy ra nếu bạn đặt chỉ thị `squash` ngay tại dòng đầu tiên
      trong tệp Todo List của Interactive Rebase?
    type: single
    options:
      - text: Git sẽ báo lỗi ngay lập tức vì dòng đầu tiên không có commit nào nằm phía
          trước để gộp vào
        correct: true
      - text: Git tự động gộp vào commit đầu tiên của toàn bộ lịch sử dự án
        correct: false
      - text: Git tự động bỏ qua commit đó
        correct: false
      - text: Máy tính sẽ tự động tắt ứng dụng Git
        correct: false
    explanation: "`squash` yêu cầu phải có một commit làm đích ở phía trước nó; dòng
      đầu tiên bắt buộc phải là một commit độc lập."
  - id: q2
    question: Sau khi lưu tệp Todo List có chứa chỉ thị `squash`, bước tiếp theo Git
      sẽ yêu cầu bạn làm gì?
    type: single
    options:
      - text: Mở cửa sổ soạn thảo chứa thông điệp của tất cả các commit thành phần để
          bạn biên tập lại thông điệp chung
        correct: true
      - text: Yêu cầu bạn nhập mật khẩu tài khoản GitHub
        correct: false
      - text: Yêu cầu bạn khởi động lại máy tính
        correct: false
      - text: Tự động đóng lại và không hỏi gì thêm
        correct: false
    explanation: Chỉ thị `squash` mở editor tổng hợp để bạn gọt giũa thông điệp
      commit kết hợp.
  - id: q3
    question: Ký tự viết tắt tương đương với từ khóa `squash` trong tệp Todo List là gì?
    type: single
    options:
      - text: s
        correct: true
      - text: q
        correct: false
      - text: c
        correct: false
      - text: m
        correct: false
    explanation: Bạn có thể gõ ngắn gọn chữ `s` thay vì phải gõ đầy đủ từ `squash`.
  - id: q4
    question: Lợi ích chính của việc gộp (squash) các commit thử nghiệm trước khi mở
      Pull Request là gì?
    type: single
    options:
      - text: Loại bỏ các commit rác vô nghĩa, giúp người review dễ đọc hiểu và lịch sử
          dự án luôn trong sạch
        correct: true
      - text: Làm tăng dung lượng mã nguồn của dự án
        correct: false
      - text: Giúp mã nguồn chạy nhanh hơn trên trình duyệt web
        correct: false
      - text: Tự động kiểm tra lỗi chính tả trong mã nguồn
        correct: false
    explanation: Squash tạo ra các khối commit nguyên tử (Atomic Commits) có ý nghĩa
      trọn vẹn, nâng cao chất lượng code review.
  - id: q5
    question: Nếu bạn có 4 commit vụn và muốn gộp cả 4 commit đó lại thành một
      commit duy nhất, Todo List cần cấu hình như thế nào?
    type: single
    options:
      - text: Dòng 1 để `pick`, 3 dòng tiếp theo để `squash` (hoặc `s`)
        correct: true
      - text: Cả 4 dòng đều để `squash`
        correct: false
      - text: Cả 4 dòng đều để `pick`
        correct: false
      - text: Dòng 1 để `drop`, 3 dòng sau để `pick`
        correct: false
    explanation: Dòng 1 là commit nền tảng nhận kết quả (`pick`), 3 dòng sau nén dồn
      vào dòng 1 (`squash`).
  - id: q6
    question: Điểm khác biệt cốt lõi giữa `squash` và `fixup` trong Interactive
      Rebase là gì?
    type: single
    options:
      - text: squash giữ lại thông điệp cũ để bạn biên tập, còn fixup tự động vứt bỏ
          thông điệp cũ mà không cần mở editor
        correct: true
      - text: squash xóa tệp, fixup giữ tệp
        correct: false
      - text: fixup chỉ dùng cho nhánh main, squash dùng cho mọi nhánh
        correct: false
      - text: Hai chỉ thị này hoàn toàn giống hệt nhau không có gì khác
        correct: false
    explanation: "`fixup` tương tự như `squash` về mặt mã nguồn, nhưng tự động loại
      bỏ thông điệp thừa để quy trình diễn ra nhanh chóng."
