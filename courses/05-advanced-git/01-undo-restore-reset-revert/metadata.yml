id: 01-undo-restore-reset-revert
title: "Undo trong Git: restore/reset/revert khác nhau"
duration: 25
xp: 80
keywords:
  - undo git
  - git restore
  - git reset
  - git revert
  - hoan tac
  - so sanh undo
prerequisites:
  - 16-team-project-challenge
objectives:
  - "Phân biệt rõ ràng mục đích, phạm vi tác động và ngữ cảnh sử dụng của 3 cơ
    chế hoàn tác: restore, reset và revert."
  - Hiểu rõ sự khác biệt giữa hoàn tác tệp tin trong Working Tree/Staging và
    hoàn tác commit trong lịch sử.
  - Nhận thức tính an toàn của git revert khi làm việc trên các nhánh cộng tác
    dùng chung so với git reset.
  - Lựa chọn chính xác câu lệnh hoàn tác phù hợp nhất cho từng tình huống phát
    sinh lỗi thực tế.
commands:
  - git restore <tên-tệp>
  - git restore --staged <tên-tệp>
  - git reset --mixed HEAD~1
  - git revert <commit-hash>
