id: 12-git-rebase
title: git rebase
duration: 35
xp: 110
keywords:
  - git rebase
  - rebase branch
  - rebase upstream
  - quy tac vang rebase
  - golden rule rebase
prerequisites:
  - 11-rebase-concept
objectives:
  - Thực thi thành thạo câu lệnh `git rebase <upstream>` để đồng bộ nhánh tính
    năng với nhánh chính.
  - Nhận biết rủi ro khi viết lại commit mà người khác đã dùng làm cơ sở.
  - Biết `--force-with-lease` giảm rủi ro cập nhật nhầm remote nhưng vẫn cần kiểm tra và phối hợp.
  - Định hình thói quen giữ lịch sử dự án luôn tinh gọn trước khi tạo Pull
    Request.
commands:
  - git fetch origin
  - git rebase origin/main
  - git rebase --abort
