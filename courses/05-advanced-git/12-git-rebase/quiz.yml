id: quiz-05-12-git-rebase
title: "Trắc nghiệm: git rebase và Quy tắc vàng"
questions:
  - id: q1
    question: '"Quy tắc vàng của Rebase" (The Golden Rule of Rebasing) trong Git quy
      định điều gì?'
    type: single
    options:
      - text: Tuyệt đối không bao giờ được phép rebase trên một nhánh công khai đang có
          nhiều người cùng làm việc chung
        correct: true
      - text: Mọi commit đều phải được tạo bằng chữ in hoa
        correct: false
      - text: Chỉ được rebase khi có sự cho phép của giám đốc công ty
        correct: false
      - text: Không được phép rebase quá 3 lần trong một ngày
        correct: false
    explanation: Rebase viết lại lịch sử; nếu làm trên nhánh chung, các đồng nghiệp
      kéo code về sẽ bị xung đột nặng nề.
  - id: q2
    question: Vì sao sau khi thực hiện rebase ở nhánh cá nhân cục bộ, lệnh `git
      push` thông thường sẽ bị máy chủ từ chối?
    type: single
    options:
      - text: Vì các commit đã được viết lại với mã hash SHA-1 mới, khiến lịch sử cục bộ
          và server không còn khớp nhau
        correct: true
      - text: Vì máy chủ GitHub bị quá tải bộ nhớ đệm
        correct: false
      - text: Vì đường truyền mạng Internet bị ngắt kết nối
        correct: false
      - text: Vì tên nhánh của bạn bị đổi thành tên khác
        correct: false
    explanation: Commit hash mới tạo ra phân kỳ lịch sử, bắt buộc phải dùng
      `--force-with-lease` để cập nhật con trỏ nhánh trên remote.
  - id: q3
    question: Tại sao cờ `--force-with-lease` lại được các chuyên gia khuyến nghị
      thay thế hoàn toàn cho cờ `-f` (`--force`)?
    type: single
    options:
      - text: Nó sẽ kiểm tra xem có ai khác vừa đẩy commit mới lên nhánh đó chưa; nếu
          có, nó từ chối push để bảo vệ code của đồng nghiệp
        correct: true
      - text: Nó tăng tốc độ tải dữ liệu lên đám mây gấp đôi
        correct: false
      - text: Nó tự động mã hóa mật khẩu kho chứa
        correct: false
      - text: Nó giúp giảm chi phí thuê máy chủ
        correct: false
    explanation: "`--force-with-lease` hoạt động như một khóa an toàn (lease), chỉ
      cho phép ghi đè nếu remote chưa bị thay đổi bởi người khác."
  - id: q4
    question: Nếu trong quá trình rebase bạn cảm thấy quá phức tạp và muốn hủy bỏ
      ngay lập tức để quay về trạng thái an toàn trước đó, bạn dùng lệnh nào?
    type: single
    options:
      - text: git rebase --abort
        correct: true
      - text: git rebase --cancel
        correct: false
      - text: git undo rebase
        correct: false
      - text: git reset --quit
        correct: false
    explanation: "`git rebase --abort` dừng toàn bộ tiến trình rebase và đưa nhánh
      của bạn quay về trạng thái y hệt lúc trước khi gõ lệnh."
