# Bảng thuật ngữ Git thống nhất (Git Academy Vietnam)
# Định nghĩa các thuật ngữ chuẩn tiếng Việt và tiếng Anh dùng xuyên suốt toàn bộ giáo trình.
# Không dịch các câu lệnh (command) và flag của Git.

repository:
  vi: kho lưu trữ
  preferred: "Repository (kho Git)"
  description: "Nơi Git quản lý tệp của dự án và lưu lịch sử các mốc bạn đã tạo. Kho có thể nằm trên máy hoặc ở một dịch vụ từ xa."

working-tree:
  vi: thư mục làm việc
  preferred: "Working Tree (thư mục làm việc)"
  description: "Các tệp trong thư mục dự án mà bạn đang xem và sửa trực tiếp. Thay đổi ở đây chưa tự trở thành một commit."

staging-area:
  vi: vùng chuẩn bị
  preferred: "Staging Area (vùng chuẩn bị)"
  description: "Bản chọn các thay đổi bạn muốn đưa vào commit tiếp theo. Dùng git add để chọn hoặc cập nhật nội dung trong vùng này."

branch:
  vi: nhánh
  preferred: "Nhánh (branch)"
  description: "Một dòng làm việc có tên trỏ đến commit hiện tại. Tạo nhánh giúp thử tính năng riêng mà chưa trộn vào nhánh khác."

commit:
  vi: commit
  preferred: "Commit (ảnh chụp snapshot)"
  description: "Một mốc đã lưu trong lịch sử Git, gồm trạng thái các tệp được chọn cùng thông tin và lời nhắn về mốc đó."

merge:
  vi: hợp nhất
  preferred: "Merge (hợp nhất)"
  description: "Đưa lịch sử và thay đổi từ một nhánh vào nhánh hiện tại. Nếu hai nhánh sửa cùng một chỗ theo cách khác nhau, bạn có thể cần giải quyết xung đột."

remote:
  vi: kho từ xa
  preferred: "Remote (kho từ xa)"
  description: "Tên kết nối lưu địa chỉ của một repository khác, thường ở dịch vụ như GitHub hoặc GitLab. Dữ liệu chỉ trao đổi khi bạn fetch, pull hoặc push."

clone:
  vi: nhân bản
  preferred: "Clone (nhân bản kho chứa)"
  description: "Tạo một kho Git trên máy từ một kho khác. Bản clone đầy đủ thông thường mang theo lịch sử để bạn làm việc cục bộ."

fetch:
  vi: lấy dữ liệu
  preferred: "Fetch (lấy dữ liệu từ xa)"
  description: "Lấy thông tin và commit mới từ remote về kho cục bộ để bạn xem; không tự đưa chúng vào nhánh đang làm."

pull:
  vi: kéo và gộp
  preferred: "Pull (kéo và gộp code)"
  description: "Lấy thay đổi từ remote rồi tích hợp vào nhánh hiện tại theo cấu hình Git; có thể cần xử lý xung đột."

push:
  vi: đẩy dữ liệu
  preferred: "Push (đẩy commit lên remote)"
  description: "Gửi commit từ kho cục bộ lên remote để chia sẻ. Push có thể bị từ chối nếu lịch sử từ xa cần được tích hợp trước."

rebase:
  vi: tái thiết lập gốc
  preferred: "Rebase (tái cấu trúc lịch sử)"
  description: "Di chuyển hoặc phát lại một chuỗi commit lên trên một commit gốc mới."

cherry-pick:
  vi: chọn lọc commit
  preferred: "Cherry-pick (chọn lọc commit)"
  description: "Trích xuất thay đổi của một commit cụ thể và áp dụng nó lên nhánh hiện tại."

reflog:
  vi: nhật ký tham chiếu
  preferred: "Reflog (nhật ký tham chiếu)"
  description: "Nhật ký ghi lại mọi chuyển động của HEAD và các nhánh trên máy cục bộ."

tag:
  vi: thẻ đánh dấu
  preferred: "Tag (thẻ phiên bản)"
  description: "Mốc đánh dấu tĩnh không đổi trỏ đến một commit quan trọng (thường dùng cho release)."

pull-request:
  vi: yêu cầu kéo code
  preferred: "Pull Request (yêu cầu kéo/gộp code)"
  description: "Đề xuất gộp các thay đổi từ một nhánh vào nhánh chính trên GitHub kèm thảo luận."
