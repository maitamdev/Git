id: quiz-08-repository
title: "Trắc nghiệm: Repository và cấu trúc .git"
questions:
  - id: q1
    question: Thành phần nào là trái tim lưu trữ toàn bộ lịch sử và đối tượng của
      một Git Repository?
    type: single
    options:
      - text: Thư mục ẩn mang tên `.git` nằm ở gốc dự án
        correct: true
      - text: Tệp tin `node_modules` chứa các thư viện JavaScript
        correct: false
      - text: Thư mục `C:\Windows\System32`
        correct: false
      - text: Tệp tin `package.json` nằm ở ngoài cùng
        correct: false
    explanation: Thư mục ẩn `.git` chứa toàn bộ cơ sở dữ liệu đối tượng, cấu hình,
      refs và lịch sử của Git.
  - id: q2
    question: Điều gì sẽ xảy ra nếu bạn xóa bỏ hoàn toàn thư mục `.git` trong một dự án?
    type: single
    options:
      - text: Dự án trở thành thư mục tệp tin bình thường, toàn bộ lịch sử commit cục bộ
          bị mất vĩnh viễn
        correct: true
      - text: Toàn bộ code trong dự án sẽ tự động bị biên dịch sang ngôn ngữ C++
        correct: false
      - text: Git sẽ tự động tải lại thư mục đó từ Google Drive về máy
        correct: false
      - text: Máy tính sẽ bị khóa màn hình và yêu cầu khởi động lại
        correct: false
    explanation: Xóa `.git` làm mất hoàn toàn lịch sử phiên bản cục bộ, chỉ giữ lại
      các tệp hiện tại trong Working Tree.
  - id: q3
    question: Thư mục con `objects/` bên trong `.git` dùng để làm gì?
    type: single
    options:
      - text: Lưu trữ cơ sở dữ liệu toàn bộ các đối tượng Blob (tệp tin), Tree (thư mục)
          và Commit
        correct: true
      - text: Lưu ảnh đại diện của các thành viên trong nhóm dự án
        correct: false
      - text: Lưu trữ tài liệu thiết kế Figma của lập trình viên giao diện
        correct: false
      - text: Chứa các tệp tạm thời tự động xóa sau 5 phút
        correct: false
    explanation: "`.git/objects/` là kho lưu trữ cơ sở dữ liệu bất biến (Object
      Database) theo mã hash SHA của Git."
  - id: q4
    question: Tệp `HEAD` bên trong thư mục `.git` đóng vai trò gì?
    type: single
    options:
      - text: Chỉ định con trỏ trỏ tới nhánh hoặc commit mà bạn đang làm việc trực tiếp
          tại thời điểm hiện tại
        correct: true
      - text: Lưu tiêu đề trang web HTML của dự án
        correct: false
      - text: Chứa ảnh đại diện của người sáng lập dự án
        correct: false
      - text: Lưu mật khẩu mã hóa của kho chứa
        correct: false
    explanation: "Tệp `HEAD` là một con trỏ tham chiếu (symref) trỏ đến nhánh hiện
      tại (ví dụ `ref: refs/heads/main`)."
