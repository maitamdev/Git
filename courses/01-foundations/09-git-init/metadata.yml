id: 09-git-init
title: Khởi tạo kho chứa với git init
duration: 25
xp: 75
keywords:
  - git init
  - khoi tao
  - new repo
  - initialize
  - first repository
prerequisites:
  - 08-repository
objectives:
  - Chạy `git init` để bắt đầu quản lý thư mục hiện tại bằng Git.
  - Dùng `git status` để kiểm tra repository vừa tạo.
  - Đặt tên nhánh ban đầu khi cần bằng `git init -b main`.
commands:
  - git init
  - git init -b main
  - git status
