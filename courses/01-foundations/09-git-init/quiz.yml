id: quiz-09-git-init
title: "Trắc nghiệm: Khởi tạo repository với git init"
questions:
  - id: q1
    question: "Lệnh nào bắt đầu quản lý thư mục hiện tại bằng Git?"
    type: single
    options:
      - text: "`git init`"
        correct: true
      - text: "`git status`"
        correct: false
      - text: "`git add .`"
        correct: false
      - text: "`git log`"
        correct: false
    explanation: >-
      `git init` tạo dữ liệu nội bộ để Git bắt đầu quản lý thư mục.
      Lệnh này chưa thêm tệp hoặc tạo commit.

  - id: q2
    question: "Trong một repository Git thông thường, thư mục nào được tạo khi chạy `git init`?"
    type: single
    options:
      - text: "`.git`"
        correct: true
      - text: "`.github`"
        correct: false
      - text: "`.repository`"
        correct: false
      - text: "`node_modules`"
        correct: false
    explanation: >-
      `git init` tạo `.git` để chứa dữ liệu cần cho repository.
      Tệp dự án có sẵn vẫn nằm trong thư mục của chúng.

  - id: q3
    question: "Bạn chạy `git init` trong thư mục đã có các tệp HTML và CSS. Điều gì xảy ra?"
    type: single
    options:
      - text: "Các tệp vẫn còn; Git tạo dữ liệu repository trong `.git`"
        correct: true
      - text: "Git xóa các tệp để bắt đầu một dự án trống"
        correct: false
      - text: "Git tự thêm mọi tệp vào commit đầu tiên"
        correct: false
      - text: "Git chỉ chạy được nếu thư mục ban đầu trống"
        correct: false
    explanation: >-
      `git init` không xóa các tệp đang có và không tự lưu chúng.
      Lệnh chỉ chuẩn bị dữ liệu Git để bắt đầu quản lý thư mục.

  - id: q4
    question: "Trên phiên bản Git hỗ trợ tùy chọn này, lệnh nào chọn `main` làm nhánh ban đầu?"
    type: single
    options:
      - text: "`git init -b main`"
        correct: true
      - text: "`git init --name main`"
        correct: false
      - text: "`git status --branch main`"
        correct: false
      - text: "`git branch --initial main`"
        correct: false
    explanation: >-
      `git init -b main` yêu cầu Git dùng `main` làm tên nhánh ban đầu.
      Tên mặc định nếu bỏ tùy chọn có thể phụ thuộc cấu hình.

  - id: q5
    question: "Ngay sau khi chạy `git init`, các tệp dự án có tự nằm trong lịch sử chưa?"
    type: single
    options:
      - text: "Chưa; bạn còn phải chọn tệp và tạo commit ở các bước sau"
        correct: true
      - text: "Có; `git init` tự tạo commit đầu tiên"
        correct: false
      - text: "Có; mọi tệp tự được gửi lên GitHub"
        correct: false
      - text: "Chưa; `git init` xóa tệp và chỉ giữ tên thư mục"
        correct: false
    explanation: >-
      `git init` chuẩn bị repository nhưng không tạo commit đầu tiên.
      Bạn sẽ học cách chọn tệp và lưu commit ở Level 2.
