id: 04-git-architecture
title: Git hoạt động như thế nào?
duration: 25
xp: 70
keywords:
  - kien truc git
  - snapshot
  - delta
  - dag
  - blob
  - tree
  - commit
prerequisites:
  - 03-git-la-gi
objectives:
  - Phân biệt rõ ràng sự khác biệt giữa mô hình lưu trữ Delta (sự khác biệt) và
    Snapshot (ảnh chụp tức thời).
  - Hiểu khái niệm Directed Acyclic Graph (DAG) và cách Git liên kết các commit
    bằng mã băm SHA.
  - "Nắm bắt sơ bộ cấu trúc các đối tượng cốt lõi trong Git: Blob, Tree, Commit."
commands:
  - git status
  - git log --oneline
