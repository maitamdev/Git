id: 05-trunk-based-development
title: Trunk-Based Development
duration: 25
xp: 90
keywords:
  - trunk-based development
  - trunk based dev
  - short-lived branches
  - feature flags
  - ci cd pipeline
  - continuous integration
  - fast iteration
prerequisites:
  - 02-feature-branch-workflow
objectives:
  - Nắm vững triết lý và thực tiễn của mô hình Trunk-Based Development được các
    gã khổng lồ công nghệ áp dụng.
  - Hiểu rõ khái niệm nhánh cực ngắn hạn (Short-lived branches) với tuổi thọ
    dưới 1 hoặc 2 ngày.
  - Làm chủ kỹ thuật Cờ tính năng (Feature Flags) để tách biệt giữa việc đưa mã
    nguồn lên main (Deploy) và kích hoạt tính năng (Release).
  - "Nhận biết các điều kiện tiên quyết để vận hành Trunk-Based Development
    thành công: kiểm thử tự động toàn diện và văn hóa review thần tốc."
commands:
  - git switch main && git pull --rebase origin main
  - git switch -c short-feat/add-rating-model
  - git push origin short-feat/add-rating-model
