id: quiz-06-12-release-branch
title: "Trắc nghiệm: Release Branch"
questions:
  - id: q1
    question: Mục đích chính cốt lõi của việc tạo ra nhánh Release Branch là gì?
    type: single
    options:
      - text: Cô lập mã nguồn để đóng băng tính năng, kiểm thử toàn diện và sửa lỗi ổn
          định hóa trước khi xuất bản
        correct: true
      - text: Để các lập trình viên bắt đầu viết các tính năng thử nghiệm hoàn toàn mới
        correct: false
      - text: Để xóa toàn bộ cơ sở dữ liệu cũ của khách hàng
        correct: false
      - text: Để giảm bớt dung lượng của thư mục .git
        correct: false
    explanation: Release Branch giúp tạo một môi trường tĩnh lặng cho QA kiểm thử
      hồi quy mà không bị xáo trộn bởi code mới từ các tính năng khác.
  - id: q2
    question: Quy tắc "Feature Freeze" (Đóng băng tính năng) trên Release Branch quy
      định điều gì?
    type: single
    options:
      - text: Nghiêm cấm thêm bất kỳ tính năng mới nào, chỉ chấp nhận các commit sửa lỗi
          và tinh chỉnh tài liệu
        correct: true
      - text: Tắt máy chủ không cho bất kỳ ai truy cập mã nguồn trong 1 tuần
        correct: false
      - text: Đóng băng tài khoản ngân hàng của công ty phần mềm
        correct: false
      - text: Chỉ cho phép lập trình viên làm việc trong phòng có máy lạnh thật lạnh
        correct: false
    explanation: Đóng băng tính năng ngăn chặn nguy cơ đưa thêm các lỗi mới vào hệ
      thống ngay sát giờ phát hành sản phẩm.
  - id: q3
    question: Sau khi một nhánh Release Branch hoàn tất kiểm thử, nó bắt buộc phải
      được hợp nhất vào những nhánh nào?
    type: single
    options:
      - text: Hợp nhất vào nhánh main để phát hành và hợp nhất ngược về develop để đồng
          bộ bản sửa lỗi
        correct: true
      - text: Chỉ hợp nhất vào nhánh main rồi xóa ngay lập tức
        correct: false
      - text: Chỉ hợp nhất vào nhánh develop
        correct: false
      - text: Không được hợp nhất vào đâu cả
        correct: false
    explanation: Hợp nhất kép (Dual-merge) bảo đảm rằng các bugfix quý giá phát hiện
      trong giai đoạn release sẽ không bị mất trong các sprint tương lai.
  - id: q4
    question: Tại sao việc dùng cờ `--no-ff` (No Fast-Forward) lại được khuyến nghị
      mạnh mẽ khi merge Release Branch?
    type: single
    options:
      - text: Để tạo một Merge Commit rõ ràng ghi nhận đầy đủ dấu vết lịch sử của đợt
          phát hành trên biểu đồ Git
        correct: true
      - text: Để ép Git phải xóa nhánh đó sau 10 giây
        correct: false
      - text: Để tăng tốc độ biên dịch mã nguồn của ngôn ngữ C++
        correct: false
      - text: Vì lệnh git không cho phép merge nếu thiếu cờ đó
        correct: false
    explanation: Cờ `--no-ff` bảo toàn hình hài của nhánh release trong biểu đồ lịch
      sử, giúp việc tra cứu các mốc phát hành sau này cực kỳ trực quan.
  - id: q5
    question: Ai là người nên có quyền quyết định cuối cùng phê duyệt cho phép một
      nhánh release được merge vào main?
    type: single
    options:
      - text: Trưởng nhóm kỹ thuật (Tech Lead) hoặc người quản lý phát hành (Release
          Manager) sau khi có xác nhận từ QA
        correct: true
      - text: Bất kỳ thực tập sinh nào rảnh rỗi
        correct: false
      - text: Nhân viên bảo vệ tòa nhà văn phòng
        correct: false
      - text: Một thuật toán ngẫu nhiên trên mạng
        correct: false
    explanation: Phát hành sản phẩm ra người dùng là quyết định quan trọng đòi hỏi
      sự thẩm định của người chịu trách nhiệm kỹ thuật cao nhất.
  - id: q6
    question: Sau khi hợp nhất thành công Release Branch vào nhánh main, thao tác
      chuẩn tiếp theo không thể thiếu là gì?
    type: single
    options:
      - text: Gắn thẻ Annotated Tag (ví dụ v1.2.0) có chữ ký hoặc thông điệp rõ ràng để
          đánh dấu cột mốc phiên bản
        correct: true
      - text: Xóa toàn bộ các tệp tin trong thư mục gốc của dự án
        correct: false
      - text: Reset máy tính cá nhân về cài đặt gốc
        correct: false
      - text: Tạo thêm 10 nhánh release rỗng để dự phòng
        correct: false
    explanation: Git Tag đánh dấu vĩnh viễn trạng thái chính xác của commit phát
      hành, làm căn cứ truy cứu và kích hoạt pipeline triển khai sản phẩm.
