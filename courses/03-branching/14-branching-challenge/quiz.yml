id: quiz-03-14-branching-challenge
title: "Trắc nghiệm tổng kết: Master Branching & Merging"
questions:
  - id: q1
    question: Quy trình chuẩn mực nhất để phát triển một tính năng mới trong nhóm là gì?
    type: single
    options:
      - text: Tạo nhánh riêng từ main -> Code và commit -> Kiểm thử -> Merge vào main ->
          Xóa nhánh tính năng
        correct: true
      - text: Code trực tiếp mọi thứ trên nhánh main của công ty
        correct: false
      - text: Tạo nhánh mới rồi không bao giờ merge vào main
        correct: false
      - text: Gửi code qua Zalo cho đồng nghiệp copy vào máy
        correct: false
    explanation: "Feature Branch Workflow: tách nhánh, phát triển độc lập, kiểm thử,
      merge và dọn dẹp là chuẩn quốc tế."
  - id: q2
    question: Khi gặp Merge Conflict, hành động nào sau đây là SAI LẦM và nghiệp dư nhất?
    type: single
    options:
      - text: Tự ý xóa code của đồng nghiệp mà không hiểu chức năng rồi commit bừa
        correct: true
      - text: Chạy git status để kiểm tra danh sách tệp bị ảnh hưởng
        correct: false
      - text: Mở tệp ra xem xét kỹ lưỡng cả hai khối code
        correct: false
      - text: Trao đổi với tác giả của nhánh kia để thống nhất giải pháp
        correct: false
    explanation: Xóa bừa code của người khác thể hiện sự thiếu chuyên nghiệp và gây
      ra các lỗi ngầm nghiêm trọng.
  - id: q3
    question: Thao tác nào sau đây biến một tệp tin từ trạng thái Unmerged sang
      Staged trong quá trình giải quyết conflict?
    type: single
    options:
      - text: git add <tên-tệp>
        correct: true
      - text: git status
        correct: false
      - text: git diff
        correct: false
      - text: git branch
        correct: false
    explanation: "`git add` là lệnh báo cho Git biết tệp đó đã được con người giải
      quyết mâu thuẫn xong."
  - id: q4
    question: Lệnh nào giúp bạn kiểm tra toàn diện đồ thị phân nhánh của tất cả các
      nhánh trong dự án?
    type: single
    options:
      - text: git log --graph --oneline --all
        correct: true
      - text: git branch --list-only
        correct: false
      - text: git show --branches
        correct: false
      - text: git tree --full
        correct: false
    explanation: "`git log --graph --oneline --all` là câu lệnh vàng để quan sát
      toàn bộ đồ thị DAG của Git."
  - id: q5
    question: Khi giải quyết xung đột, nếu hai phần logic của cả hai nhánh đều cần
      thiết thì lựa chọn phù hợp nhất là gì?
    type: single
    options:
      - text: Kết hợp cả hai logic, kiểm thử kỹ lưỡng rồi mới hoàn tất merge commit
        correct: true
      - text: Chỉ chọn code của bản thân và xóa hết code người khác
        correct: false
      - text: Xóa toàn bộ tệp tin để không ai có lỗi
        correct: false
      - text: Bỏ qua và không chạy kiểm thử tự động
        correct: false
    explanation: Nhiều trường hợp đòi hỏi tích hợp hài hòa cả hai nghiệp vụ để đảm
      bảo ứng dụng chạy đúng toàn diện.
  - id: q6
    question: Tại sao việc dọn dẹp các nhánh đã hoàn thành và đã merge lại là một
      thực hành tốt trong kỹ thuật phần mềm?
    type: single
    options:
      - text: Giúp kho lưu trữ luôn tinh gọn, giảm nguy cơ thao tác nhầm trên nhánh cũ
          và giúp đồng nghiệp dễ theo dõi
        correct: true
      - text: Để giải phóng hàng trăm gigabyte dung lượng ổ cứng
        correct: false
      - text: Để tránh việc GitHub tính thêm tiền phí lưu trữ nhánh
        correct: false
      - text: Vì Git tự động khóa kho chứa nếu có quá mười nhánh
        correct: false
    explanation: Dọn dẹp các nhánh cũ đã merge là thói quen vệ sinh mã nguồn chuyên
      nghiệp của mọi kỹ sư Git.
