id: 06-branch-isolation
title: Nguyên lý cách ly không gian Branch Isolation
duration: 25
xp: 80
keywords:
  - branch isolation
  - cach ly khong gian
  - song song
  - an toan nhanh
  - doc lap
prerequisites:
  - 04-git-switch
objectives:
  - Hiểu rõ nguyên lý cách ly không gian (Branch Isolation) độc lập của các
    luồng phát triển trong Git.
  - Nhận biết phạm vi tác động của commit trên từng nhánh riêng biệt.
  - Tự tin phát triển các tính năng thử nghiệm mạo hiểm mà không sợ làm ảnh
    hưởng tới nhánh chính.
  - Phân tích sự phân kỳ lịch sử (divergent history) khi hai nhánh cùng tiến về
    phía trước.
commands:
  - git switch -c <nhánh-thử-nghiệm>
  - git log --oneline --graph --all
  - git diff main..<nhánh-thử-nghiệm>
