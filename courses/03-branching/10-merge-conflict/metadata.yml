id: 10-merge-conflict
title: Xung đột Merge Conflict là gì?
duration: 30
xp: 90
keywords:
  - merge conflict
  - xung dot
  - conflict markers
  - ours theirs
  - mau thuan code
prerequisites:
  - 08-three-way-merge
objectives:
  - Giải thích vì sao Git phải dừng khi không thể tự kết hợp thay đổi.
  - Nhận diện conflict markers và xác định nội dung của mỗi nhánh.
