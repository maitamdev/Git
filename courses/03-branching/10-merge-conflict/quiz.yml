id: quiz-03-10-merge-conflict
title: "Trắc nghiệm: Bản chất Merge Conflict"
questions:
  - id: q1
    question: Nguyên nhân cốt lõi dẫn đến việc phát sinh Merge Conflict trong Git là gì?
    type: single
    options:
      - text: Hai nhánh cùng chỉnh sửa các dòng code giống nhau trong cùng một tệp kể từ
          commit tổ tiên chung
        correct: true
      - text: Do máy tính của lập trình viên bị nhiễm virus phần mềm độc hại
        correct: false
      - text: Do kho lưu trữ Git đã vượt quá giới hạn 100 commit
        correct: false
      - text: Do lập trình viên gõ sai tên tác giả trong lệnh git config
        correct: false
    explanation: Xung đột xảy ra khi Git phát hiện hai thay đổi mâu thuẫn trên cùng
      một vị trí dòng code mà không thể tự giải quyết.
  - id: q2
    question: Trong cấu trúc Conflict Markers, phần nội dung nằm giữa `<<<<<<< HEAD`
      và `=======` đại diện cho điều gì?
    type: single
    options:
      - text: Nội dung code hiện tại của nhánh bạn đang đứng trực tiếp (OURS)
        correct: true
      - text: Nội dung code của nhánh mà bạn đang muốn gộp vào (THEIRS)
        correct: false
      - text: Nội dung code của bản phát hành đầu tiên cách đây mười năm
        correct: false
      - text: Mã nguồn do trí tuệ nhân tạo tự động viết thêm
        correct: false
    explanation: Phần trên `=======` là HEAD (nhánh hiện tại bạn đang đứng); phần
      dưới là nhánh đang được merge vào.
  - id: q3
    question: Ký hiệu `>>>>>>> <tên-nhánh>` trong tệp xung đột đánh dấu điều gì?
    type: single
    options:
      - text: Điểm kết thúc của khối code đến từ nhánh đang được gộp vào
        correct: true
      - text: Điểm bắt đầu của một hàm lập trình mới
        correct: false
      - text: Vị trí tệp tin bị virus máy tính tấn công
        correct: false
      - text: Lệnh thoát khỏi cửa sổ terminal
        correct: false
    explanation: "`>>>>>>>` là vạch kết thúc của khối thay đổi đến từ nhánh nguồn (theirs)."
  - id: q4
    question: Khi xảy ra conflict, lệnh nào hiển thị danh sách các tệp tin đang bị
      xung đột cần xử lý?
    type: single
    options:
      - text: git status
        correct: true
      - text: git crash-report
        correct: false
      - text: git clean-all
        correct: false
      - text: git emergency
        correct: false
    explanation: "`git status` liệt kê rõ ràng các tệp conflict dưới mục `Unmerged
      paths: both modified: <file>`."
  - id: q5
    question: Tại sao lập trình viên không được phép để sót lại các ký tự `<<<<<<<`
      hoặc `=======` trong mã nguồn khi commit?
    type: single
    options:
      - text: Vì đây là các ký tự đánh dấu của Git, để sót lại sẽ khiến trình biên dịch
          báo lỗi cú pháp và làm hỏng ứng dụng
        correct: true
      - text: Vì Git sẽ tự động xóa tài khoản GitHub của bạn nếu phát hiện
        correct: false
      - text: Vì các ký tự này làm máy tính bị quá tải bộ nhớ RAM
        correct: false
      - text: Vì tổ chức tiêu chuẩn W3C nghiêm cấm sử dụng các ký tự này
        correct: false
    explanation: Conflict markers là văn bản thô; để lại trong code sẽ làm gãy cú
      pháp chương trình.
  - id: q6
    question: Nếu cảm thấy chưa sẵn sàng giải quyết conflict và muốn quay về trạng
      thái sạch sẽ ban đầu, bạn dùng lệnh gì?
    type: single
    options:
      - text: git merge --abort
        correct: true
      - text: git cancel now
        correct: false
      - text: git delete conflict
        correct: false
      - text: git undo everything
        correct: false
    explanation: "`git merge --abort` khôi phục trạng thái Working Tree và HEAD về
      chính xác trước khi ra lệnh merge."
