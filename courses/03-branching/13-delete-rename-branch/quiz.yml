id: quiz-03-13-delete-rename-branch
title: "Trắc nghiệm: Xóa và đổi tên nhánh an toàn"
questions:
  - id: q1
    question: Lệnh nào sau đây dùng để đổi tên nhánh bạn đang đứng trực tiếp thành
      `feat/payment`?
    type: single
    options:
      - text: git branch -m feat/payment
        correct: true
      - text: git branch --new-id feat/payment
        correct: false
      - text: git rename feat/payment
        correct: false
      - text: git switch --rename feat/payment
        correct: false
    explanation: "`git branch -m <new-name>` đổi tên nhánh hiện tại sang tên mới."
  - id: q2
    question: Khi bạn chạy lệnh `git branch -d feature` trên một nhánh đã được merge
      vào main, điều gì thực sự bị xóa?
    type: single
    options:
      - text: Chỉ có tệp con trỏ tham chiếu 41 byte chứa tên nhánh bị xóa, toàn bộ
          commit vẫn nằm an toàn trong nhánh main
        correct: true
      - text: Toàn bộ các dòng code bạn đã viết trong nhánh feature sẽ bị xóa sạch khỏi
          ổ cứng
        correct: false
      - text: Nhánh main sẽ bị xóa theo
        correct: false
      - text: Tài khoản GitHub của bạn sẽ bị đóng băng
        correct: false
    explanation: Branch chỉ là con trỏ; khi đã merge thì commit đã thuộc về main,
      xóa branch chỉ gỡ con trỏ phụ.
  - id: q3
    question: Lệnh nào dùng để xóa một nhánh có tên là `old-feature` trên máy chủ từ
      xa GitHub?
    type: single
    options:
      - text: git push origin --delete old-feature
        correct: true
      - text: git remote delete old-feature
        correct: false
      - text: git delete-server old-feature
        correct: false
      - text: git drop remote old-feature
        correct: false
    explanation: "`git push origin --delete <branch>` gửi chỉ thị xóa con trỏ nhánh
      trên máy chủ remote."
  - id: q4
    question: Trong trường hợp nào Git sẽ kiên quyết từ chối lệnh xóa nhánh an toàn
      `git branch -d`?
    type: single
    options:
      - text: Khi nhánh đó chứa các commit mới chưa từng được hợp nhất (merge) vào bất
          kỳ nhánh nào khác
        correct: true
      - text: Khi máy tính bị mất kết nối mạng cáp quang
        correct: false
      - text: Khi tên nhánh có chứa dấu gạch nối
        correct: false
      - text: Khi nhánh đó có dung lượng nhỏ hơn 1 kilobyte
        correct: false
    explanation: "`-d` có cơ chế bảo vệ ngăn chặn việc vô tình xóa mất commit chưa
      được hợp nhất."
  - id: q5
    question: "Để đổi tên một nhánh khác (ví dụ: đổi nhánh `dev` thành `develop`) mà
      không cần switch sang nhánh đó, bạn dùng cú pháp nào?"
    type: single
    options:
      - text: git branch -m dev develop
        correct: true
      - text: git rename-remote dev develop
        correct: false
      - text: git switch --move dev develop
        correct: false
      - text: git checkout dev --rename develop
        correct: false
    explanation: "`git branch -m <tên-cũ> <tên-mới>` cho phép đổi tên nhánh bất kỳ
      ngay cả khi không đứng trên nhánh đó."
  - id: q6
    question: Nếu bạn vô tình xóa nhầm một nhánh chưa merge bằng lệnh `git branch
      -D`, công cụ nào giúp bạn tìm lại mã SHA của commit để khôi phục?
    type: single
    options:
      - text: git reflog
        correct: true
      - text: Thùng rác Recycle Bin của hệ điều hành
        correct: false
      - text: Trình duyệt Google Chrome
        correct: false
      - text: Lệnh ping mạng Internet
        correct: false
    explanation: "`git reflog` ghi lại mọi chuyển dịch của HEAD; bạn có thể tra cứu
      mã commit đỉnh của nhánh bị xóa để tái tạo lại."
