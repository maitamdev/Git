id: quiz-03-08-three-way-merge
title: "Trắc nghiệm: Thuật toán Three-way merge"
questions:
  - id: q1
    question: Thuật toán Three-way merge của Git sử dụng chính xác 3 mốc snapshot
      nào dưới đây để đối chiếu?
    type: single
    options:
      - text: Commit tổ tiên chung gần nhất (Base), đỉnh nhánh hiện tại (Ours), và đỉnh
          nhánh được gộp (Theirs)
        correct: true
      - text: Ba commit đầu tiên khi dự án vừa được khởi tạo bằng git init
        correct: false
      - text: Ba commit ngẫu nhiên do máy tính tự động chọn từ kho lưu trữ
        correct: false
      - text: Ba nhánh khác nhau của ba lập trình viên khác nhau
        correct: false
    explanation: Thuật toán 3 chiều đối chiếu Base, Ours và Theirs để nhận diện
      chính xác từng bên đã thay đổi những gì.
  - id: q2
    question: Điểm đặc biệt quan trọng nhất của một Merge Commit sinh ra từ
      Three-way merge là gì?
    type: single
    options:
      - text: Nó có hai (hoặc nhiều hơn) commit cha trỏ về đỉnh của các nhánh vừa được
          hợp nhất
        correct: true
      - text: Nó không có mã băm SHA nào cả
        correct: false
      - text: Nó tự động xóa bỏ toàn bộ mã nguồn của nhánh con
        correct: false
      - text: Nó không chứa bất kỳ dòng thông điệp mô tả nào
        correct: false
    explanation: Merge Commit là một nút đặc biệt trong đồ thị DAG có 2 con trỏ cha
      (parent commits).
  - id: q3
    question: Nếu nhánh A sửa tệp `user.js` và nhánh B sửa tệp `product.js` kể từ
      điểm rẽ nhánh chung, kết quả khi merge B vào A sẽ là gì?
    type: single
    options:
      - text: Git tự động hợp nhất thành công hoàn toàn và tạo ra một Merge Commit mới
          mà không có xung đột
        correct: true
      - text: Git sẽ báo lỗi xung đột nghiêm trọng và hủy bỏ toàn bộ thay đổi
        correct: false
      - text: Git sẽ xóa tệp product.js và chỉ giữ lại user.js
        correct: false
      - text: Git bắt buộc lập trình viên phải chọn xóa một trong hai tệp
        correct: false
    explanation: Thay đổi trên các tệp tin độc lập hoàn toàn không gây conflict; Git
      tự động kết hợp cả hai tệp vào snapshot mới.
  - id: q4
    question: Lệnh nào cho phép bạn tra cứu trực tiếp mã băm của commit tổ tiên
      chung giữa hai nhánh `main` và `feature`?
    type: single
    options:
      - text: git merge-base main feature
        correct: true
      - text: git find-ancestor main feature
        correct: false
      - text: git common-root main feature
        correct: false
      - text: git parent-search main feature
        correct: false
    explanation: "`git merge-base <branch1> <branch2>` in ra mã SHA của commit tổ
      tiên chung gần nhất."
  - id: q5
    question: Thông điệp commit mặc định mà Git tự động gợi ý khi tạo một Merge
      Commit có dạng như thế nào?
    type: single
    options:
      - text: Merge branch 'feature' into main (hoặc tương đương)
        correct: true
      - text: Oops! An error occurred
        correct: false
      - text: Auto backup daily report
        correct: false
      - text: Delete old files
        correct: false
    explanation: Git tự động tạo message mặc định nêu rõ tên nhánh nguồn được gộp
      vào nhánh đích.
  - id: q6
    question: Khi trình soạn thảo tự động mở ra yêu cầu xác nhận thông điệp của
      merge commit, bạn cần làm gì để hoàn tất quá trình merge?
    type: single
    options:
      - text: Lưu tệp tin và đóng trình soạn thảo lại (ví dụ trong Nano bấm Ctrl+O rồi
          Ctrl+X, hoặc trong Vim gõ :wq)
        correct: true
      - text: Rút phích cắm điện máy tính ngay lập tức
        correct: false
      - text: Bấm phím Delete trên bàn phím liên tục
        correct: false
      - text: Gõ thêm mật khẩu ngân hàng của bạn vào tệp
        correct: false
    explanation: Đóng trình soạn thảo sau khi lưu sẽ hoàn tất thao tác tạo Merge
      Commit trong Git.
