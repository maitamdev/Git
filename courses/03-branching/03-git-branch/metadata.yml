id: 03-git-branch
title: Xem và tạo nhánh bằng git branch
duration: 25
xp: 80
keywords:
  - git branch
  - danh sach nhanh
  - tao nhanh
prerequisites:
  - 01-branch-concept
objectives:
  - Dùng git branch để xem nhánh cục bộ.
  - Dùng git branch <tên> để tạo nhánh mới.
  - Đọc dấu * để nhận biết nhánh đang chọn.
commands:
  - git branch
  - git branch <tên-nhánh>
