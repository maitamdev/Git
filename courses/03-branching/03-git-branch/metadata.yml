id: 03-git-branch
title: Quản lý nhánh với git branch
duration: 25
xp: 80
keywords:
  - git branch
  - quan ly nhanh
  - xoa nhanh
  - danh sach nhanh
  - branch list
prerequisites:
  - 01-branch-concept
objectives:
  - "Sử dụng thành thạo câu lệnh `git branch` cùng các cờ tùy chọn nâng cao:
    `-a`, `-r`, `-vv`, `--merged`."
  - Xóa nhánh an toàn với cờ `-d` và xóa nhánh cưỡng chế với cờ `-D`.
  - Đổi tên nhánh cục bộ nhanh chóng bằng cờ `-m`.
  - Kiểm soát và dọn dẹp các nhánh đã hợp nhất để giữ kho lưu trữ luôn tinh gọn.
commands:
  - git branch
  - git branch -a
  - git branch -vv
  - git branch -m <tên-cũ> <tên-mới>
  - git branch -d <tên-nhánh>
  - git branch -D <tên-nhánh>
