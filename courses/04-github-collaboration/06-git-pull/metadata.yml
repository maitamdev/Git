id: 06-git-pull
title: Đồng bộ và gộp code với git pull
duration: 30
xp: 90
keywords:
  - git pull
  - fetch and merge
  - dong bo code
  - pull rebase
  - cap nhat local
prerequisites:
  - 05-git-fetch
objectives:
  - Hiểu `git pull` fetch thay đổi rồi tích hợp vào nhánh hiện tại theo tùy chọn/cấu hình Git.
  - Sử dụng thành thạo câu lệnh `git pull` để kéo và tích hợp mã nguồn mới nhất
    từ GitHub.
  - Kiểm tra nhánh và trạng thái trước khi pull; nhận biết có thể phát sinh conflict.
  - Bình tĩnh xử lý khi gặp xung đột Merge Conflict phát sinh trong quá trình
    pull.
commands:
  - git pull
  - git pull origin <tên-nhánh>
