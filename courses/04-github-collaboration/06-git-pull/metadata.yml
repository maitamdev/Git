id: 06-git-pull
title: Đồng bộ và gộp code với git pull
duration: 30
xp: 90
keywords:
  - git pull
  - fetch and merge
  - dong bo code
  - pull rebase
  - cap nhat local
prerequisites:
  - 05-git-fetch
objectives:
  - "Hiểu rõ công thức toán học bản chất của `git pull`: `git fetch` kết hợp với
    `git merge`."
  - Sử dụng thành thạo câu lệnh `git pull` để kéo và tích hợp mã nguồn mới nhất
    từ GitHub.
  - "Hiểu sự khác biệt giữa hai chiến lược tích hợp: `git pull --ff-only` và
    `git pull --rebase`."
  - Bình tĩnh xử lý khi gặp xung đột Merge Conflict phát sinh trong quá trình
    pull.
commands:
  - git pull
  - git pull origin <tên-nhánh>
  - git pull --rebase
  - git pull --ff-only
