id: 07-git-push
title: Đẩy commit lên server với git push
duration: 30
xp: 95
keywords:
  - git push
  - day code
  - push origin
  - upstream tracking
  - -u flag
  - rejected
prerequisites:
  - 04-git-clone
objectives:
  - Sử dụng câu lệnh `git push` để đẩy các commit cục bộ lên máy chủ từ xa
    GitHub.
  - Hiểu rõ ý nghĩa của cờ `-u` (`--set-upstream`) trong lần push đầu tiên của
    một nhánh mới.
  - Nhận biết lỗi non-fast-forward và kiểm tra/tích hợp thay đổi remote trước khi thử push lại.
  - Tránh force-push lên nhánh dùng chung khi chưa hiểu tác động và chưa có sự đồng thuận.
commands:
  - git push
  - git push origin <tên-nhánh>
  - git push -u origin <tên-nhánh>
