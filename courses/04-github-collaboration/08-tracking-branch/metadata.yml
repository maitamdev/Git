id: 08-tracking-branch
title: Nhánh theo dõi Tracking Branch
duration: 25
xp: 80
keywords:
  - tracking branch
  - upstream branch
  - ahead behind
  - remote tracking
  - dong bo nhanh
prerequisites:
  - 07-git-push
objectives:
  - Hiểu rõ khái niệm và cơ chế hoạt động của Tracking Branch (Nhánh theo dõi)
    trong Git.
  - "Phân biệt rõ ràng giữa 3 loại nhánh: Nhánh cục bộ, Nhánh theo dõi từ xa
    (`origin/main`), và Nhánh thực tế trên server."
  - "Đọc hiểu và giải thích ý nghĩa các trạng thái so sánh: `ahead`, `behind`,
    và `diverged`."
  - Thiết lập hoặc thay đổi quan hệ upstream tracking cho một nhánh cục bộ bất
    kỳ.
commands:
  - git status
  - git branch -vv
  - git branch -u origin/<tên-nhánh>
  - git branch --unset-upstream
