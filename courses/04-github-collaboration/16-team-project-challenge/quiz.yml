id: quiz-04-16-team-project-challenge
title: "Trắc nghiệm tổng kết: Master GitHub Collaboration"
questions:
  - id: q1
    question: Quy trình chuẩn mực nhất để một kỹ sư phần mềm hoàn thành một nhiệm vụ
      trong dự án nhóm là gì?
    type: single
    options:
      - text: Đọc Issue -> Pull main mới nhất -> Tạo feature branch -> Code & Commit ->
          Push -> Mở PR -> Nhận review & sửa đổi -> Merge & Dọn nhánh
        correct: true
      - text: Commit trực tiếp vào nhánh main của công ty rồi gửi tin nhắn bảo đồng
          nghiệp tự kiểm tra
        correct: false
      - text: Tải mã nguồn về máy rồi gửi file nén ZIP qua email cho sếp
        correct: false
      - text: Xóa toàn bộ dự án cũ và tự viết lại một ứng dụng hoàn toàn mới
        correct: false
    explanation: Chu trình 7 bước khép kín từ Issue đến Merge là chuẩn mực quốc tế
      của phát triển phần mềm chuyên nghiệp.
  - id: q2
    question: Khi đồng nghiệp để lại nhận xét "Request changes" trên PR của bạn,
      thái độ và hành động chuẩn mực nhất là gì?
    type: single
    options:
      - text: Đọc kỹ lý do kỹ thuật, trao đổi văn minh để làm rõ nếu chưa hiểu, thực
          hiện chỉnh sửa bổ sung và push commit mới lên PR
        correct: true
      - text: Nổi giận và tìm cách công kích cá nhân đồng nghiệp trên mạng xã hội
        correct: false
      - text: Đóng PR và xóa toàn bộ tài khoản GitHub của mình
        correct: false
      - text: Bỏ qua nhận xét và cố tình cưỡng chế merge code vào main
        correct: false
    explanation: Code Review là cơ hội hoàn thiện mã nguồn; đón nhận phản biện với
      tinh thần cầu thị và chuyên nghiệp.
  - id: q3
    question: Sự khác biệt căn bản giữa hai nhánh `main` và `origin/main` trên máy
      tính cá nhân của bạn là gì?
    type: single
    options:
      - text: "`main` là con trỏ nhánh cục bộ bạn có thể commit sửa đổi, còn
          `origin/main` là con trỏ chỉ đọc phản ánh trạng thái trên server"
        correct: true
      - text: Hai con trỏ này hoàn toàn giống nhau 100% không có gì khác biệt
        correct: false
      - text: "`origin/main` là nhánh của tổng thống Mỹ, `main` là của người dùng"
        correct: false
      - text: "`main` chỉ lưu tệp ảnh, `origin/main` chỉ lưu mã nguồn"
        correct: false
    explanation: "`origin/main` là Remote-tracking branch do Git tự cập nhật khi
      fetch; bạn không thể commit trực tiếp lên nó."
  - id: q4
    question: Tại sao việc viết Commit Message và mô tả Pull Request rõ ràng lại cực
      kỳ quan trọng đối với dự án dài hạn?
    type: single
    options:
      - text: Giúp lưu trữ tài liệu kỹ thuật, giải thích lý do đưa ra quyết định kiến
          trúc và hỗ trợ việc bảo trì sau này
        correct: true
      - text: Để đáp ứng yêu cầu tính số lượng từ ngữ của quản trị viên
        correct: false
      - text: Để làm đẹp mắt giao diện web của GitHub
        correct: false
      - text: Vì nếu không viết thì máy tính sẽ tự động tắt nguồn
        correct: false
    explanation: Tài liệu commit và PR là di sản quý giá giúp các thế hệ kỹ sư sau
      hiểu được bối cảnh tại sao code lại được viết như vậy.
  - id: q5
    question: Để kiểm tra xem nhánh cục bộ của bạn đang đi trước hay tụt sau nhánh
      remote bao nhiêu commit, lệnh nào hiển thị trực quan nhất?
    type: single
    options:
      - text: git status hoặc git branch -vv
        correct: true
      - text: git show --cloud
        correct: false
      - text: git remote ping
        correct: false
      - text: git network-check
        correct: false
    explanation: "`git status` và `git branch -vv` in rõ trạng thái `ahead N` và
      `behind M` của tracking branch."
  - id: q6
    question: Sau khi hoàn thành xuất sắc toàn bộ 16 bài học của Level 4, bạn đã đạt
      được năng lực nào sau đây?
    type: single
    options:
      - text: Tự tin cộng tác nhóm, làm chủ toàn bộ chu trình GitHub, xử lý xung đột
          mạng và tham gia vào các dự án chuyên nghiệp
        correct: true
      - text: Trở thành chuyên gia phần cứng sửa chữa vi mạch máy tính
        correct: false
      - text: Biết cách hack mật khẩu tài khoản ngân hàng của người khác
        correct: false
      - text: Có thể lập trình mà không cần dùng đến bàn phím máy tính
        correct: false
    explanation: Level 4 trang bị toàn bộ kỹ năng cộng tác nhóm và văn hóa Git
      chuyên nghiệp trên GitHub.
