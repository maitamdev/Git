id: 05-git-fetch
title: Cập nhật dữ liệu từ xa với git fetch
duration: 25
xp: 85
keywords:
  - git fetch
  - remote-tracking branch
  - origin/main
  - cap nhat du lieu
  - an toan
prerequisites:
  - 04-git-clone
objectives:
  - Hiểu `git fetch` tải dữ liệu và cập nhật remote-tracking refs mà không tích hợp vào nhánh hiện tại.
  - Phân biệt rõ ràng giữa nhánh theo dõi từ xa (Remote-tracking branch
    `origin/main`) và nhánh cục bộ (`main`).
  - Phân biệt dữ liệu đã fetch với các file trong Working Directory.
  - Sử dụng `git log` và `git diff` để kiểm tra mã nguồn mới tải về trước khi
    quyết định hợp nhất.
commands:
  - git fetch
  - git fetch origin
  - git log HEAD..origin/main --oneline
  - git diff HEAD..origin/main
