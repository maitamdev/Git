id: quiz-04-13-merge-pull-request
title: "Trắc nghiệm: Quy trình Merge Pull Request"
questions:
  - id: q1
    question: Chiến lược "Squash and merge" trên GitHub thực hiện hành vi kỹ thuật
      nào đối với các commit của PR?
    type: single
    options:
      - text: Nén toàn bộ các commit nhỏ trong nhánh tính năng thành một commit hoàn
          chỉnh duy nhất trên nhánh chính
        correct: true
      - text: Xóa sạch toàn bộ mã nguồn của PR và từ chối gộp
        correct: false
      - text: Nhân đôi số lượng commit lên gấp hai lần để lưu trữ dự phòng
        correct: false
      - text: Chuyển toàn bộ commit thành các tệp văn bản PDF
        correct: false
    explanation: Squash gom tất cả các thay đổi thành 1 commit duy nhất, giúp lịch
      sử nhánh chính cực kỳ tinh gọn.
  - id: q2
    question: Ưu điểm vượt trội nhất của chiến lược "Rebase and merge" là gì?
    type: single
    options:
      - text: Tạo ra một lịch sử commit hoàn toàn tuyến tính (thẳng tắp) mà không sinh
          ra bất kỳ merge commit nào
        correct: true
      - text: Tự động kiểm tra lỗi chính tả tiếng Việt trong mã nguồn
        correct: false
      - text: Không cần kết nối mạng Internet vẫn merge được
        correct: false
      - text: Cho phép merge ngay cả khi code đang bị lỗi cú pháp nghiêm trọng
        correct: false
    explanation: Rebase and merge áp dụng từng commit lên đầu nhánh chính tạo ra một
      chuỗi lịch sử thẳng đều.
  - id: q3
    question: Sau khi một Pull Request đã được merge thành công vào nhánh main trên
      GitHub, hành động vệ sinh kho chứa chuẩn mực là gì?
    type: single
    options:
      - text: Bấm nút "Delete branch" để xóa bỏ con trỏ nhánh tính năng đã hoàn thành
          trên GitHub
        correct: true
      - text: Xóa toàn bộ kho lưu trữ của công ty
        correct: false
      - text: Khóa tài khoản của tất cả các lập trình viên vừa tham gia review
        correct: false
      - text: Tạo ngay một nhánh mới có cùng tên để ghi đè
        correct: false
    explanation: Nhánh đã merge thì toàn bộ code đã nằm an toàn trong main; xóa
      nhánh giúp danh sách nhánh luôn gọn gàng.
  - id: q4
    question: Sau khi PR được merge trên GitHub, lập trình viên cần làm gì trên máy
      tính cá nhân để cập nhật nhánh main của mình?
    type: single
    options:
      - text: Chuyển về nhánh main bằng `git switch main` rồi chạy `git pull origin
          main`
        correct: true
      - text: Không cần làm gì cả vì máy tính sẽ tự động biết qua sóng tâm linh
        correct: false
      - text: Xóa toàn bộ thư mục dự án và clone lại từ đầu
        correct: false
      - text: Cài lại hệ điều hành Windows
        correct: false
    explanation: Bạn cần chuyển về nhánh main và pull để đồng bộ commit merge từ
      GitHub về không gian làm việc cục bộ.
  - id: q5
    question: Khi nào việc sử dụng chiến lược truyền thống "Create a merge commit"
      là phù hợp và có lợi nhất?
    type: single
    options:
      - text: Khi dự án áp dụng quy trình Git Flow và muốn bảo lưu nguyên vẹn từng ranh
          giới nhánh và lịch sử tích hợp tính năng lớn
        correct: true
      - text: Khi nhánh tính năng chỉ có đúng một dòng sửa lỗi chính tả nhỏ
        correct: false
      - text: Khi máy tính bị mất kết nối mạng Internet
        correct: false
      - text: Khi muốn làm chậm tốc độ build của hệ thống
        correct: false
    explanation: Merge Commit lưu vết ranh giới phát triển và bối cảnh tích hợp, hữu
      ích cho các dự án dài hạn cần kiểm toán chặt chẽ.
  - id: q6
    question: Nếu một Pull Request bị xung đột (Merge Conflict) với nhánh main, nút
      Merge trên GitHub sẽ như thế nào?
    type: single
    options:
      - text: Nút Merge sẽ bị vô hiệu hóa (bị xám) và GitHub yêu cầu bạn phải giải quyết
          xung đột trước khi được merge
        correct: true
      - text: GitHub sẽ tự động chọn nhánh của người có cấp bậc cao hơn để merge
        correct: false
      - text: GitHub sẽ tự động xóa đoạn code bị xung đột để merge tiếp
        correct: false
      - text: Nút Merge vẫn bấm được bình thường và bỏ qua lỗi
        correct: false
    explanation: "Git kiên quyết bảo vệ tính toàn vẹn: có xung đột thì nút Merge bị
      khóa cho đến khi conflict được giải quyết."
