id: 13-merge-pull-request
title: Quy trình Merge Pull Request
duration: 30
xp: 100
keywords:
  - merge pr
  - merge commit
  - squash and merge
  - rebase and merge
  - dong pr
  - delete branch
prerequisites:
  - 12-code-review
objectives:
  - Nắm vững quy trình hợp nhất (Merge) một Pull Request hoàn chỉnh vào nhánh
    chính trên GitHub.
  - Phân biệt merge commit, squash merge và rebase merge nếu repository bật các phương thức đó.
  - Hiểu rõ ưu và nhược điểm của từng chiến lược đối với đồ thị lịch sử của dự
    án.
  - Cập nhật nhánh local sau khi merge và chỉ xóa nhánh nếu không còn cần dùng.
commands:
  - git switch main
  - git pull origin main
  - git branch -d feat/my-feature
