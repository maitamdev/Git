id: 13-merge-pull-request
title: Quy trình Merge Pull Request
duration: 30
xp: 100
keywords:
  - merge pr
  - merge commit
  - squash and merge
  - rebase and merge
  - dong pr
  - delete branch
prerequisites:
  - 12-code-review
objectives:
  - Nắm vững quy trình hợp nhất (Merge) một Pull Request hoàn chỉnh vào nhánh
    chính trên GitHub.
  - "Phân biệt rõ ràng 3 chiến lược merge được GitHub cung cấp: Create a merge
    commit, Squash and merge, và Rebase and merge."
  - Hiểu rõ ưu và nhược điểm của từng chiến lược đối với đồ thị lịch sử của dự
    án.
  - Thực hiện thao tác dọn dẹp xóa nhánh tính năng sau khi PR đã được merge
    thành công.
commands:
  - git switch main
  - git pull origin main
  - git branch -d feat/my-feature
