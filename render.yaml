services:
  - type: web
    name: git-academy-api
    runtime: node
    plan: starter
    region: singapore
    buildCommand: pnpm install && pnpm --filter @git-academy/api build
    startCommand: node apps/api/dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: APP_URL
        sync: false
